<!DOCTYPE html>
<html lang="ja">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#f0f2f5;color:#1d1d1f;font-size:16px;overscroll-behavior:none}
/* ============ SCREENS ============ */
.screen{display:none;min-height:100vh}
.screen.on{display:block}
/* ============ HOME SCREEN ============ */
.home-hdr{background:#1d1d1f;padding:20px 16px 18px;position:sticky;top:0;z-index:100}
.home-hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}

.home-hdr-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}

.stats-row{display:flex;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.home-body{padding:14px}

.month-left{display:flex;align-items:center;gap:10px}
.month-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.month-name{font-size:17px;font-weight:700;color:#1d1d1f}
.month-count{font-size:12px;color:#aaa;margin-top:2px}
.month-arrow{font-size:18px;color:#ccc;transition:transform .2s;flex-shrink:0}
.month-arrow.open{transform:rotate(90deg)}
.month-body{display:none;border-top:1px solid #f0f0f0}
.month-body.open{display:block}
.art-row{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #f5f5f5;gap:12px;cursor:pointer;touch-action:manipulation}
.art-row:last-child{border-bottom:none}
.art-row:active{background:#f8f8f8}
.art-date{font-size:12px;font-weight:700;color:#aaa;white-space:nowrap;padding-top:2px;min-width:44px}
.art-right{flex:1;min-width:0}
.art-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;margin-bottom:5px}
.art-title{font-size:14px;font-weight:600;color:#1d1d1f;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art-source{font-size:11px;color:#aaa;margin-top:4px}
.art-arrow-icon{font-size:14px;color:#ddd;flex-shrink:0;padding-top:4px}
.badge-mlb{background:#e8f0fb;color:#1a5fa8}
.badge-sg{background:#fde8e8;color:#c0392b}
.badge-ai{background:#ede9fe;color:#4a3f8f}
.badge-biz{background:#fef3c7;color:#92400e}
.badge-news{background:#dcfce7;color:#166534}
/* ============ ARTICLE SCREEN ============ */
.art-screen-hdr{padding:12px 14px;position:sticky;top:0;z-index:100}
.art-hdr-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.art-badge-hdr{background:rgba(255,255,255,.25);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:700;flex-shrink:0;margin-top:2px}
.back-btn{padding:7px 11px;font-size:12px;font-weight:700;border-radius:8px;border:1.5px solid rgba(255,255,255,.6);color:#fff;background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;touch-action:manipulation}
.art-hdr-title{font-size:14px;font-weight:700;color:#fff;line-height:1.35;flex:1;min-width:0}
.art-hdr-meta{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.ctrls{display:flex;gap:7px;flex-wrap:wrap}
.cbtn{font-size:12px;padding:6px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;font-weight:600;touch-action:manipulation}
.cbtn.on{background:rgba(255,255,255,.25);border-color:#fff}
.art-tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:104px;z-index:90}
.art-tab{flex:1;padding:12px 4px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;color:#aaa;border-bottom:3px solid transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.art-tab.on{border-bottom-color:var(--theme)}
#artTabArticle.on,#artTabVocab.on{color:var(--theme)}
.art-pane{display:none;padding:14px}
.art-pane.on{display:block}
/* article cards */
.pcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:12px;overflow:hidden}
.section-hdr{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 6px;border-bottom:1px solid #eee;color:var(--theme);background:var(--theme-bg)}
.pen{padding:14px 14px 8px;font-size:15px;line-height:1.9;color:#1d1d1f}
.pact{display:flex;gap:7px;padding:8px 14px;background:#f5f5f7}
.pbtn{font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#444;cursor:pointer;font-weight:500;min-height:36px;touch-action:manipulation}
.pbtn:active{background:#eee}

.vhl{font-weight:700;display:inline}
.vhl.linked{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;color:var(--theme)}

.gram-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;border-top:1px solid #eee;background:#fafafa}

.tr{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:700;white-space:nowrap}

.expair{border:1px solid #e8e8e8;border-radius:10px;padding:10px 12px;cursor:pointer;touch-action:manipulation}

.quiz-btn.correct{background:#f0fff4;border-color:#166534;color:#166534}
.quiz-btn.wrong{background:#fff0f0;border-color:#c0392b;color:#c0392b}
.quiz-feedback{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;text-align:center;margin-bottom:8px}
.quiz-feedback.ok{background:#f0fff4;color:#166534}
.quiz-feedback.ng{background:#fff0f0;color:#c0392b}
.quiz-next{width:100%;padding:12px;border-radius:10px;border:none;background:var(--theme);color:#fff;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.chip{font-size:12px;padding:4px 12px;border-radius:20px;background:#f0f0f0;color:#555;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipa{background:#fff0f0;color:#b91c1c}

/* ============ TOAST ============ */

<script>
/* ================================================
   IndexedDB
================================================ */
var DB_NAME='eigoApp',DB_VER=1,DB_STORE='articles';
var db=null;

function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      e.target.result.createObjectStore(DB_STORE,{keyPath:'id'});
    };
    req.onsuccess=function(e){db=e.target.result;resolve(db);};
    req.onerror=function(e){reject(e);};
  });
}

function dbGetAll(){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).getAll();
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=reject;
  });
}

function dbPut(obj){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).put(obj);
    req.onsuccess=function(){resolve();};
    req.onerror=reject;
  });
}

function dbGet(id){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).get(id);
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=reject;
  });
}

/* ================================================
   HOME
================================================ */
var allArticles=[];
var BADGE_COLORS={'mlb':'badge-mlb','sg':'badge-sg','ai':'badge-ai','biz':'badge-biz','news':'badge-news'};

function loadHome(){
  dbGetAll().then(function(rows){
    allArticles=rows.sort(function(a,b){return b.date.localeCompare(a.date);});
    renderHome();
  });
}

function renderHome(){
  var totalVocab=0;
  allArticles.forEach(function(a){
    try{var vd=eval('('+a.vd+')');totalVocab+=vd.length;}catch(e){}
  });

  document.getElementById('statArticles').textContent=allArticles.length;
  document.getElementById('statVocab').textContent=totalVocab;

  var monthMap={},monthOrder=[];
  allArticles.forEach(function(a){
    var ym=a.date.substring(0,7);
    if(!monthMap[ym]){monthMap[ym]=[];monthOrder.push(ym);}
    monthMap[ym].push(a);
  });
  document.getElementById('statMonths').textContent=monthOrder.length;

  var container=document.getElementById('articleList');
  container.innerHTML='';

  if(allArticles.length===0){
    container.innerHTML='<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-title">記事がまだありません</div><div class="empty-text">「＋ 記事を追加」ボタンから<br>記事JSONを貼り付けて追加してください</div></div>';
    return;
  }

  var colors=['#1a5fa8','#166534','#4a3f8f','#c0392b','#92400e','#0369a1'];
  monthOrder.forEach(function(ym,mi){
    var arts=monthMap[ym];
    var parts=ym.split('-');
    var label=parts[0]+'年 '+parseInt(parts[1])+'月';
    var color=colors[mi%colors.length];
    var bodyId='m_'+ym.replace('-','');
    var arrId='ma_'+ym.replace('-','');

    var rowsHtml=arts.map(function(a){
      var dd=parseInt(a.date.substring(8,10));
      var mm=parseInt(a.date.substring(5,7));
      var badgeClass=BADGE_COLORS[a.badge]||'badge-mlb';
      return '<div class="art-row" onclick="openArticle(\''+a.id+'\')"><div class="art-date">'+mm+'月'+dd+'日</div><div class="art-right"><span class="art-badge '+badgeClass+'">'+esc(a.badgeLabel)+'</span><div class="art-title">'+esc(a.title)+'</div><div class="art-source">'+esc(a.source||'')+'</div></div><div class="art-arrow-icon">›</div></div>';
    }).join('');

    var card=document.createElement('div');
    card.className='month-card';
    card.innerHTML='<div class="month-head" onclick="toggleMonth(\''+bodyId+'\',\''+arrId+'\')">'
      +'<div class="month-left"><div class="month-dot" style="background:'+color+'"></div>'
      +'<div><div class="month-name">'+label+'</div><div class="month-count">'+arts.length+'記事</div></div></div>'
      +'<div class="month-arrow" id="'+arrId+'">›</div></div>'
      +'<div class="month-body" id="'+bodyId+'">'+rowsHtml+'</div>';
    container.appendChild(card);
  });

  // 最新月を自動展開
  if(monthOrder.length>0){
    var first=monthOrder[0];
    toggleMonth('m_'+first.replace('-',''),'ma_'+first.replace('-',''));
  }
}

function toggleMonth(bodyId,arrId){
  var body=document.getElementById(bodyId);
  var arr=document.getElementById(arrId);
  var isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  arr.classList.toggle('open',!isOpen);
}

/* ================================================
   IMPORT
================================================ */
function openImport(){
  document.getElementById('fileInput').value='';
  document.getElementById('importProgress').style.display='none';
  document.getElementById('importResult').style.display='none';
  document.getElementById('importError').style.display='none';
  document.getElementById('importModal').classList.add('on');
}

function closeImport(){
  document.getElementById('importModal').classList.remove('on');
  // インポート後にホームを更新
  loadHome();
}

function handleFiles(files){
  if(!files||files.length===0)return;
  var total=files.length;
  var done=0,success=0,errors=[];
  var prog=document.getElementById('importProgress');
  var res=document.getElementById('importResult');
  prog.style.display='block';
  prog.textContent='読み込み中... 0 / '+total;
  res.style.display='none';

  Array.from(files).forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=JSON.parse(e.target.result);
        if(!data.id||!data.date||!data.title){
          errors.push(file.name+': 必須フィールド不足');
          done++;check();return;
        }
        // art/vd/gdが配列の場合は文字列に変換
        if(Array.isArray(data.art))data.art=JSON.stringify(data.art);
        if(Array.isArray(data.vd))data.vd=JSON.stringify(data.vd);
        if(Array.isArray(data.gd))data.gd=JSON.stringify(data.gd);

        dbPut(data).then(function(){
          success++;done++;
          prog.textContent='読み込み中... '+done+' / '+total;
          check();
        }).catch(function(err){
          errors.push(file.name+': 保存エラー');
          done++;check();
        });
      }catch(err){
        errors.push(file.name+': JSON解析エラー');
        done++;check();
      }
    };
    reader.readAsText(file,'utf-8');
  });

  function check(){
    if(done<total)return;
    prog.style.display='none';
    res.style.display='block';
    if(errors.length===0){
      res.className='import-result ok';
      res.innerHTML='✅ '+success+'件をインポートしました！<br><span style="font-size:12px">「閉じる」を押すと記事一覧が更新されます</span>';
    }else{
      res.className='import-result ng';
      res.innerHTML='⚠️ '+success+'件成功 / '+errors.length+'件エラー<br>'+errors.join('<br>');
    }
  }
}

/* ================================================
   ARTICLE SCREEN
================================================ */
var currentArt=null;
var jaOn=true,boldOn=true,speakMode=false,vIdx=0,exShowEn=true,exShowJa=true,quizState=null;
var curART=[],curVD=[],curGD=[],curVD_MAP={};

function openArticle(id){
  dbGet(id).then(function(data){
    if(!data)return;
    currentArt=data;

    // データをevalで復元
    try{curART=typeof data.art==='string'?eval('('+data.art+')'):data.art;}catch(e){curART=[];}
    try{curVD=typeof data.vd==='string'?eval('('+data.vd+')'):data.vd;}catch(e){curVD=[];}
    try{curGD=typeof data.gd==='string'?eval('('+data.gd+')'):data.gd;}catch(e){curGD=[];}
    curVD_MAP={};curVD.forEach(function(v,i){curVD_MAP[v.word]=i;});

    // テーマカラー設定
    var color=data.color||'#1a5fa8';
    var themeAlpha=color+'1a'; // 10% alpha fallback
    document.documentElement.style.setProperty('--theme',color);
    // テーマ背景色をカラーから生成
    document.documentElement.style.setProperty('--theme-bg',hexToRgba(color,0.07));
    document.documentElement.style.setProperty('--theme-bg-strong',hexToRgba(color,0.12));

    // ヘッダー設定
    document.getElementById('artHdr').style.background=color;
    document.getElementById('artBadge').textContent=data.badgeLabel||'';
    document.getElementById('artHdrTitle').textContent=data.title||'';
    document.getElementById('artHdrMeta').textContent=data.meta||'';

    // タブ色
    document.getElementById('artTabArticle').style.color='';
    document.getElementById('artTabVocab').style.color='';

    // 状態リセット
    jaOn=true;boldOn=true;speakMode=false;vIdx=0;exShowEn=true;exShowJa=true;
    document.getElementById('btnJa').className='cbtn on';
    document.getElementById('btnBold').className='cbtn on';
    document.getElementById('btnSpeak').className='cbtn';

    // 記事タブのtop位置をヘッダーの高さに合わせる
    setTimeout(function(){
      var hdrH=document.getElementById('artHdr').offsetHeight;
      document.getElementById('artTabsBar').style.top=hdrH+'px';
    },50);

    buildArticlePane();
    buildVocabPane();
    showArtPane('article');
    showScreen('screenArticle');
    window.scrollTo(0,0);
  });
}

function goHome(){
  showScreen('screenHome');
  window.scrollTo(0,0);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
}

function showArtPane(name){
  document.getElementById('artPaneArticle').classList.toggle('on',name==='article');
  document.getElementById('artPaneVocab').classList.toggle('on',name==='vocab');
  document.getElementById('artTabArticle').classList.toggle('on',name==='article');
  document.getElementById('artTabVocab').classList.toggle('on',name==='vocab');
  if(name==='article'){
    document.getElementById('artTabArticle').style.color='var(--theme)';
    document.getElementById('artTabVocab').style.color='';
  }else{
    document.getElementById('artTabVocab').style.color='var(--theme)';
    document.getElementById('artTabArticle').style.color='';
  }
}

/* ================================================
   ARTICLE BUILDER
================================================ */
function buildArticlePane(){
  var c=document.getElementById('artPaneArticle');
  c.innerHTML='';

  var normalWrap=document.createElement('div');normalWrap.id='articleNormal';

  curART.forEach(function(p,i){
    if(p.section){
      var sh=document.createElement('div');sh.className='section-hdr';sh.textContent=p.section;normalWrap.appendChild(sh);
    }
    var g=curGD[i];
    var d=document.createElement('div');d.className='pcard';
    var tokHtml='',notesHtml='';
    if(g){
      tokHtml=(g.tokens||[]).map(function(t){return'<div class="tok"><span class="tw">'+esc(t.w)+'</span><span class="tr r'+t.r+'">'+t.r+'</span></div>';}).join('');
      notesHtml=(g.notes||[]).map(function(n){return'<div class="gnote"><b>'+esc(n.t)+'</b><br><br>'+n.b+'</div>';}).join('');
    }
    var bodyId='gb'+i;
    d.innerHTML='<div class="pen">'+p.en+'</div>'
      +'<div class="pact"><button class="pbtn" onclick="spk(curART['+i+'].plain)">🔊 読み上げ</button></div>'
      +'<div class="pja">'+p.ja+'</div>'
      +(g?'<div class="gram-toggle" onclick="toggleGram(\''+bodyId+'\',\'gta'+i+'\')">'
          +'<span class="gram-toggle-label">📖 文法・構文解説</span>'
          +'<span class="gram-toggle-arr" id="gta'+i+'">›</span>'
        +'</div>'
        +'<div class="gram-body" id="'+bodyId+'">'
          +'<div class="gsec">構文ラベル</div>'
          +'<div class="tokens">'+tokHtml+'</div>'
          +'<div class="gsec">文法・表現の解説</div>'
          +'<div class="gnotes">'+notesHtml+'</div>'
          +'<button class="gram-spk" onclick="spk(curART['+i+'].plain)">🔊 音声を聞く</button>'
        +'</div>':'');
    normalWrap.appendChild(d);
  });

  normalWrap.querySelectorAll('.vhl').forEach(function(el){
    var w=el.getAttribute('data-w');
    if(w&&curVD_MAP[w]!==undefined){
      el.classList.add('linked');
      el.addEventListener('click',function(ev){ev.stopPropagation();showArtPane('vocab');setTimeout(function(){goToVocab(curVD_MAP[w]);},80);});
    }else{el.classList.add('nolink');}
  });
  normalWrap.querySelectorAll('.vhl-ja').forEach(function(el){el.classList.add('bold-on');});

  // speak wrap
  var speakWrap=document.createElement('div');speakWrap.id='articleSpeak';speakWrap.className='speak-mode';
  var banner=document.createElement('div');banner.className='speak-banner';
  banner.innerHTML='<div><div class="speak-banner-text">🎧 英文のみモード</div><div class="speak-banner-hint">段落をタップ → 全選択 → Speak</div></div><button class="speak-close" onclick="toggleSpeakMode()">× 閉じる</button>';
  speakWrap.appendChild(banner);
  curART.forEach(function(p,i){
    if(p.section){var sl=document.createElement('div');sl.style.cssText='font-size:11px;font-weight:800;color:var(--theme);text-transform:uppercase;margin:12px 2px 4px;letter-spacing:.06em';sl.textContent='— '+p.section+' —';speakWrap.appendChild(sl);}
    var card=document.createElement('div');card.className='speak-card';
    var label=document.createElement('div');label.className='speak-label';label.textContent='Paragraph '+(i+1);card.appendChild(label);
    var ta=document.createElement('textarea');ta.className='speak-ta';ta.readOnly=true;ta.value=p.plain;
    ta.addEventListener('focus',function(){var self=this;setTimeout(function(){self.select();},50);});
    ta.addEventListener('click',function(){this.select();});
    card.appendChild(ta);speakWrap.appendChild(card);
  });

  c.appendChild(normalWrap);c.appendChild(speakWrap);
}

function toggleGram(bodyId,arrId){

/* ================================================
   VOCAB
================================================ */
function buildVocabPane(){
  var bar=document.getElementById('vChipBar');bar.innerHTML='';
  curVD.forEach(function(v,i){
    var chip=document.createElement('div');chip.className='vchip'+(i===0?' on':'');chip.id='chip'+i;chip.textContent=v.word;
    chip.onclick=function(){goToVocab(i);};bar.appendChild(chip);
  });
  if(curVD.length>0)renderVocab(0);
}

function goToVocab(idx){
  vIdx=idx;exShowEn=true;exShowJa=true;
  curVD.forEach(function(_,i){var c=document.getElementById('chip'+i);if(c)c.className='vchip'+(i===vIdx?' on':'');});
  var active=document.getElementById('chip'+vIdx);if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  renderVocab(vIdx);
  window.scrollTo(0,0);
}

function renderVocab(idx){
  if(idx!==undefined)vIdx=idx;
  var v=curVD[vIdx];if(!v)return;
  var wrap=document.getElementById('vDetailWrap');
  var exRows=v.ex.map(function(e,ei){return'<div class="expair" onclick="revealEx('+ei+')" id="exp'+ei+'"><div class="exen" id="exen'+ei+'">'+esc(e.e)+'</div><div class="exja" id="exja'+ei+'">'+esc(e.j)+'</div></div>';}).join('');
  wrap.innerHTML='<div class="vdetail"><div class="vdhead"><div class="vbig">'+esc(v.word)+'</div><div class="vrow"><span class="vph">'+esc(v.pron)+'</span><span class="vpos-tag">'+esc(v.pos.split('（')[0].substring(0,6))+'</span><button class="spkbtn" onclick="spk(\''+v.word.replace(/'/g,"\\'")+'\')">🔊 発音</button></div><div class="vdef">'+esc(v.def)+'</div></div><div class="divl"></div><div class="ex-head"><div class="vsec">例文（5つ）</div><div class="ex-toggles"><button class="ex-toggle on" id="togEn" onclick="toggleEx(\'en\')">英文</button><button class="ex-toggle on" id="togJa" onclick="toggleEx(\'ja\')">和文</button></div></div><div class="ex-list" id="exList">'+exRows+'</div><div class="divl"></div><div id="quizWrap" class="quiz-wrap"></div><div class="divl"></div><div style="padding-bottom:20px"><div class="vsec">類義語</div><div class="chips">'+v.syns.map(function(s){return'<span class="chip">'+esc(s)+'</span>';}).join('')+'</div><div class="vsec" style="margin-top:10px">対義語</div><div class="chips">'+v.ants.map(function(a){return'<span class="chip chipa">'+esc(a)+'</span>';}).join('')+'</div></div></div>';
  applyExVisibility();buildQuiz();
}

function toggleEx(type){if(type==='en'){exShowEn=!exShowEn;document.getElementById('togEn').className='ex-toggle'+(exShowEn?' on':'');}else{exShowJa=!exShowJa;document.getElementById('togJa').className='ex-toggle'+(exShowJa?' on':'');}applyExVisibility();}
function applyExVisibility(){curVD[vIdx].ex.forEach(function(_,i){var en=document.getElementById('exen'+i);var ja=document.getElementById('exja'+i);if(en)en.className='exen'+(exShowEn?'':' ex-hidden');if(ja)ja.className='exja'+(exShowJa?'':' ex-hidden');});}
function revealEx(i){var en=document.getElementById('exen'+i);var ja=document.getElementById('exja'+i);if(en)en.className='exen';if(ja)ja.className='exja';}

function buildQuiz(){
  var v=curVD[vIdx];if(!v||!v.syns||!v.syns.length){document.getElementById('quizWrap').innerHTML='';return;}
  var correct=v.syns[Math.floor(Math.random()*v.syns.length)];
  var pool=[];curVD.forEach(function(x){if(x.word!==v.word){pool.push(x.word);(x.syns||[]).forEach(function(s){pool.push(s);});(x.ants||[]).forEach(function(a){pool.push(a);});}});
  pool=pool.filter(function(p,idx){return pool.indexOf(p)===idx&&p!==correct&&v.syns.indexOf(p)<0;});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
  var choices=[correct,pool[0]||'other1',pool[1]||'other2',pool[2]||'other3'];
  for(var k=choices.length-1;k>0;k--){var l=Math.floor(Math.random()*(k+1));var t=choices[k];choices[k]=choices[l];choices[l]=t;}
  quizState={correct:correct,choices:choices,answered:false,score:0,total:0};
  document.getElementById('quizWrap').innerHTML=renderQuizHtml(v,quizState);
}
function renderQuizHtml(v,state){var btns=state.choices.map(function(c,ci){return'<button class="quiz-btn" id="qb'+ci+'" onclick="answerQuiz('+ci+')">'+esc(c)+'</button>';}).join('');return'<div class="quiz-head"><div class="vsec" style="margin-bottom:0">🧠 類義語クイズ</div><div class="quiz-score" id="qScore">'+state.score+' / '+state.total+'</div></div><div class="quiz-q">「<b>'+esc(v.word)+'</b>」の類義語はどれ？</div><div class="quiz-choices" id="qChoices">'+btns+'</div><div id="qFeedback" style="display:none"></div><button class="quiz-next" id="qNext" style="display:none" onclick="nextQuiz()">次の問題へ →</button>';}
function answerQuiz(ci){if(quizState.answered)return;quizState.answered=true;quizState.total++;var chosen=quizState.choices[ci];var ok=chosen===quizState.correct;if(ok)quizState.score++;quizState.choices.forEach(function(c,i){var b=document.getElementById('qb'+i);if(b)b.className='quiz-btn'+(c===quizState.correct?' correct':(i===ci?' wrong':''));});var fb=document.getElementById('qFeedback');if(fb){fb.style.display='block';fb.className='quiz-feedback '+(ok?'ok':'ng');fb.textContent=ok?'✓ 正解！':'✗ 不正解。正解は「'+quizState.correct+'」';}var sc=document.getElementById('qScore');if(sc)sc.textContent=quizState.score+' / '+quizState.total;var nx=document.getElementById('qNext');if(nx)nx.style.display='block';}
function nextQuiz(){var v=curVD[vIdx];var correct=v.syns[Math.floor(Math.random()*v.syns.length)];var pool=[];curVD.forEach(function(x){if(x.word!==v.word){pool.push(x.word);(x.syns||[]).forEach(function(s){pool.push(s);});(x.ants||[]).forEach(function(a){pool.push(a);});}});pool=pool.filter(function(p,idx){return pool.indexOf(p)===idx&&p!==correct&&v.syns.indexOf(p)<0;});for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}var choices=[correct,pool[0]||'other1',pool[1]||'other2',pool[2]||'other3'];for(var k=choices.length-1;k>0;k--){var l=Math.floor(Math.random()*(k+1));var t=choices[k];choices[k]=choices[l];choices[l]=t;}var prev=quizState;quizState={correct:correct,choices:choices,answered:false,score:prev.score,total:prev.total};document.getElementById('quizWrap').innerHTML=renderQuizHtml(v,quizState);}

/* ================================================
   UTILS
================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function spk(txt){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=0.88;speechSynthesis.cancel();speechSynthesis.speak(u);}

function hexToRgba(hex,alpha){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}
