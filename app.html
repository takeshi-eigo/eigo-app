<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語学習">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>英語学習アプリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#f0f2f5;color:#1d1d1f;font-size:16px;overscroll-behavior:none}
/* ============ SCREENS ============ */
.screen{display:none;min-height:100vh}
.screen.on{display:block}
/* ============ HOME SCREEN ============ */
.home-hdr{background:#1d1d1f;padding:20px 16px 14px;position:sticky;top:0;z-index:100}
.search-bar{display:flex;gap:8px;margin-top:12px}
.search-input{flex:1;padding:10px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:14px;outline:none;-webkit-appearance:none}
.search-input::placeholder{color:rgba(255,255,255,.4)}
.search-input:focus{background:rgba(255,255,255,.2)}
.tag-bar{display:flex;overflow-x:auto;gap:7px;padding:10px 14px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tag-bar::-webkit-scrollbar{display:none}
.tag-chip{font-size:12px;padding:5px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;white-space:nowrap;font-weight:600;flex-shrink:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tag-chip.on{background:rgba(255,255,255,.9);color:#1d1d1f;border-color:transparent}
.home-hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.home-hdr-icon{font-size:24px}
.home-hdr-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}
.home-hdr-sub{font-size:13px;color:#888;margin-top:2px}
.stats-row{display:flex;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.home-body{padding:14px}
.import-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#2c3e50;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px;touch-action:manipulation}
.import-btn:active{opacity:.85}
.month-card{background:#fff;border-radius:14px;border:1px solid #e0e0e0;margin-bottom:12px;overflow:hidden}
.month-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.month-head:active{background:#f8f8f8}
.month-left{display:flex;align-items:center;gap:10px}
.month-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.month-name{font-size:17px;font-weight:700;color:#1d1d1f}
.month-count{font-size:12px;color:#aaa;margin-top:2px}
.month-arrow{font-size:18px;color:#ccc;transition:transform .2s;flex-shrink:0}
.month-arrow.open{transform:rotate(90deg)}
.month-body{display:none;border-top:1px solid #f0f0f0}
.month-body.open{display:block}
.art-row{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #f5f5f5;gap:12px;cursor:pointer;touch-action:manipulation}
.art-row:last-child{border-bottom:none}
.art-row:active{background:#f8f8f8}
.art-date{font-size:12px;font-weight:700;color:#aaa;white-space:nowrap;padding-top:2px;min-width:44px}
.art-right{flex:1;min-width:0}
.art-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;margin-bottom:5px}
.art-title{font-size:14px;font-weight:600;color:#1d1d1f;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art-source{font-size:11px;color:#aaa;margin-top:4px}
.art-arrow-icon{font-size:14px;color:#ddd;flex-shrink:0;padding-top:4px}
.badge-mlb{background:#e8f0fb;color:#1a5fa8}
.badge-sg{background:#fde8e8;color:#c0392b}
.badge-ai{background:#ede9fe;color:#4a3f8f}
.badge-biz{background:#fef3c7;color:#92400e}
.badge-news{background:#dcfce7;color:#166534}
/* ============ ARTICLE SCREEN ============ */
.art-screen-hdr{padding:12px 14px;position:sticky;top:0;z-index:100}
.art-hdr-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.art-badge-hdr{background:rgba(255,255,255,.25);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:700;flex-shrink:0;margin-top:2px}
.back-btn{padding:7px 11px;font-size:12px;font-weight:700;border-radius:8px;border:1.5px solid rgba(255,255,255,.6);color:#fff;background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;touch-action:manipulation}
.art-hdr-title{font-size:14px;font-weight:700;color:#fff;line-height:1.35;flex:1;min-width:0}
.art-hdr-meta{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.ctrls{display:flex;gap:7px;flex-wrap:wrap}
.cbtn{font-size:12px;padding:6px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;font-weight:600;touch-action:manipulation}
.cbtn.on{background:rgba(255,255,255,.25);border-color:#fff}
.art-tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:104px;z-index:90}
.art-tab{flex:1;padding:12px 4px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;color:#aaa;border-bottom:3px solid transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.art-tab.on{border-bottom-color:var(--theme)}
#artTabArticle.on,#artTabVocab.on{color:var(--theme)}
.art-pane{display:none;padding:14px}
.art-pane.on{display:block}
/* article cards */
.pcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:12px;overflow:hidden}
.section-hdr{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 6px;border-bottom:1px solid #eee;color:var(--theme);background:var(--theme-bg)}
.pen{padding:14px 14px 8px;font-size:15px;line-height:1.9;color:#1d1d1f;-webkit-user-select:text;user-select:text;cursor:text}
.pact{display:flex;gap:7px;padding:8px 14px;background:#f5f5f7}
.pbtn{font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#444;cursor:pointer;font-weight:500;min-height:36px;touch-action:manipulation}
.pbtn:active{background:#eee}
.pja{padding:8px 14px 10px;font-size:14px;line-height:1.85;color:#555;border-top:1px solid #eee}
.vhl{font-weight:700;display:inline}
.vhl.linked{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;color:var(--theme)}
.vhl.nolink{color:#1d1d1f}
.vhl-ja{display:inline;font-weight:700;transition:background .15s,color .15s}
.vhl-ja.bold-on{color:var(--theme);background:var(--theme-bg-strong);border-radius:3px;padding:0 2px}
.gram-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;border-top:1px solid #eee;background:#fafafa}
.gram-toggle:active{background:#f0f0f0}
.gram-toggle-label{font-size:12px;font-weight:700;color:var(--theme)}
.gram-toggle-arr{font-size:13px;color:#aaa;transition:transform .2s}
.gram-toggle-arr.open{transform:rotate(90deg)}
.gram-body{display:none;border-top:1px solid #eee}
.gram-body.open{display:block}
.gtrans{display:none}
.gsec{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px 5px}
.tokens{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 10px}
.tok{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.tw{font-size:11px;font-weight:600;color:#1d1d1f;max-width:100px;text-align:center;word-break:break-word;line-height:1.3}
.tr{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:700;white-space:nowrap}
.rS{background:#dbeafe;color:#1e40af}.rV{background:#dcfce7;color:#166534}.rO{background:#fef3c7;color:#92400e}.rADV{background:#f3e8ff;color:#6b21a8}.rADJ{background:#e0f2fe;color:#0369a1}.rC{background:#fce7f3;color:#9d174d}
.gnotes{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.gnote{font-size:13px;color:#333;line-height:1.8;padding:11px;background:#f8f8f8;border-radius:8px;border-left:3px solid var(--theme)}
.gnote b{color:#1d1d1f;font-weight:700}
.gram-spk{font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#444;cursor:pointer;font-weight:500;touch-action:manipulation;margin:0 14px 12px}
/* speak mode */
.speak-mode{display:none}.speak-mode.on{display:block}
.speak-banner{border:1.5px solid var(--theme);border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--theme-bg)}
.speak-banner-text{font-size:13px;font-weight:700;color:var(--theme)}
.speak-banner-hint{font-size:11px;color:#6a7a8a;margin-top:3px;line-height:1.5}
.speak-close{font-size:13px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--theme);background:#fff;color:var(--theme);cursor:pointer;font-weight:700;white-space:nowrap;flex-shrink:0;touch-action:manipulation}
.speak-card{margin-bottom:12px}
.speak-label{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;padding:0 2px}
.speak-ta{width:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:16px;line-height:1.85;color:#1d1d1f;background:#fff;border:1.5px solid #ccd;border-radius:10px;padding:12px 13px;resize:none;outline:none;overflow:hidden;-webkit-appearance:none}
.speak-ta:focus{border-color:var(--theme);background:#fafeff}
/* vocab */
.vchip-bar{display:flex;overflow-x:auto;gap:7px;padding:10px 14px;background:#f5f5f7;border-bottom:1px solid #eee;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.vchip-bar::-webkit-scrollbar{display:none}
.vchip{font-size:12px;padding:5px 11px;border-radius:20px;border:1.5px solid #ddd;background:#fff;color:#555;cursor:pointer;touch-action:manipulation;white-space:nowrap;font-weight:600;flex-shrink:0}
.vchip.on{background:var(--theme);border-color:var(--theme);color:#fff}
.vdetail{padding:16px 14px 0}
.vdhead{margin-bottom:12px}
.vbig{font-size:24px;font-weight:700;color:#1d1d1f;line-height:1.2;-webkit-user-select:text;user-select:text;cursor:text}
.vrow{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.vph{font-size:13px;color:#888;font-family:'Courier New',monospace}
.vpos-tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--theme-bg);color:var(--theme);font-weight:700}
.vdef{font-size:15px;color:#1d1d1f;margin-top:8px;font-weight:600;line-height:1.4}
.spkbtn{padding:7px 14px;border-radius:8px;border:1px solid #ccc;background:#f5f5f7;color:#444;cursor:pointer;font-size:13px;font-weight:500;touch-action:manipulation}
.divl{height:1px;background:#eee;margin:14px 0}
.vsec{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.ex-toggles{display:flex;gap:6px}
.ex-toggle{font-size:12px;padding:5px 11px;border-radius:20px;border:1.5px solid #ccc;background:#fff;color:#666;cursor:pointer;touch-action:manipulation;font-weight:600}
.ex-toggle.on{background:var(--theme);color:#fff;border-color:var(--theme)}
.ex-list{display:flex;flex-direction:column;gap:8px}
.expair{border:1px solid #e8e8e8;border-radius:10px;padding:10px 12px;touch-action:manipulation}
.expair:active{background:#f8f8f8}
.exen{font-size:14px;color:#1d1d1f;line-height:1.6;font-weight:500;transition:filter .2s,opacity .2s;-webkit-user-select:text;user-select:text;cursor:text}
.exja{font-size:13px;color:#666;margin-top:4px;line-height:1.5;transition:filter .2s,opacity .2s;-webkit-user-select:text;user-select:text;cursor:text}
.ex-hidden{opacity:0;user-select:none;pointer-events:none;filter:blur(4px)}
.quiz-wrap{padding:0 0 16px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.quiz-score{font-size:12px;color:#aaa;font-weight:600}
.quiz-q{font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:10px;line-height:1.5;padding:12px;background:#f5f5f7;border-radius:10px}
.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.quiz-btn{padding:11px 8px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;text-align:center;color:#1d1d1f;line-height:1.3}
.quiz-btn.correct{background:#f0fff4;border-color:#166534;color:#166534}
.quiz-btn.wrong{background:#fff0f0;border-color:#c0392b;color:#c0392b}
.quiz-feedback{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;text-align:center;margin-bottom:8px}
.quiz-feedback.ok{background:#f0fff4;color:#166534}
.quiz-feedback.ng{background:#fff0f0;color:#c0392b}
.quiz-next{width:100%;padding:12px;border-radius:10px;border:none;background:var(--theme);color:#fff;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.chip{font-size:12px;padding:4px 12px;border-radius:20px;background:#f0f0f0;color:#555;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipa{background:#fff0f0;color:#b91c1c}
/* ============ IMPORT MODAL ============ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.modal-overlay.on{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-sub{font-size:13px;color:#888;margin-bottom:16px;line-height:1.6}
.file-pick-btn{width:100%;padding:18px;border-radius:12px;border:2px dashed #1a5fa8;background:#f0f5fb;color:#1a5fa8;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;margin-bottom:12px;text-align:center}
.file-pick-btn:active{background:#ddeaf8}
.import-progress{display:none;font-size:13px;color:#555;margin-bottom:8px;line-height:1.8;padding:10px 12px;background:#f5f5f7;border-radius:8px}
.import-result{display:none;font-size:13px;margin-bottom:8px;line-height:1.8;padding:10px 12px;border-radius:8px}
.import-result.ok{background:#f0fff4;color:#166534}
.import-result.ng{background:#fff0f0;color:#c0392b}
.modal-btns{display:flex;gap:10px;margin-top:12px}
.modal-btn-cancel{flex:1;padding:13px;border-radius:10px;border:1.5px solid #ddd;background:#fff;color:#666;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.modal-btn-ok{flex:2;padding:13px;border-radius:10px;border:none;background:#1a5fa8;color:#fff;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.modal-btn-ok:active{opacity:.85}
.modal-error{font-size:13px;color:#c0392b;margin-top:8px;display:none}
/* ============ TOAST ============ */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* ============ STUDY MENU ============ */
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.menu-overlay.on{display:flex}
.menu-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%}
.menu-title{font-size:13px;font-weight:700;color:#aaa;text-align:center;margin-bottom:14px;letter-spacing:.05em;text-transform:uppercase}
.menu-item{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:12px;cursor:pointer;touch-action:manipulation;margin-bottom:8px;background:#f5f5f7}
.menu-item:active{background:#e8e8e8}
.menu-item-icon{font-size:28px;flex-shrink:0}
.menu-item-body{flex:1}
.menu-item-title{font-size:16px;font-weight:700;color:#1d1d1f}
.menu-item-desc{font-size:12px;color:#888;margin-top:2px}
.menu-cancel{width:100%;padding:14px;border-radius:12px;border:none;background:#f5f5f7;color:#c0392b;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;margin-top:4px}
/* ============ STUDY SCREEN ============ */
.study-hdr{background:#1d1d1f;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px}
.study-back{padding:7px 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.study-hdr-title{font-size:16px;font-weight:800;color:#fff;flex:1}
.study-body{padding:16px}
.study-card{background:#fff;border-radius:16px;padding:24px 20px;margin-bottom:16px;border:1px solid #e0e0e0;min-height:160px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.study-q-label{font-size:14px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;background:#1d1d1f;padding:5px 14px;border-radius:20px}
.study-q-main{font-size:22px;font-weight:800;color:#1d1d1f;line-height:1.35;margin-bottom:6px}
.study-q-sub{font-size:14px;color:#888;line-height:1.5}
.study-q-sentence{font-size:16px;color:#1d1d1f;line-height:1.8;font-weight:500}
.study-blank{font-size:20px;font-weight:800;color:#1a5fa8;border-bottom:3px solid #1a5fa8;padding:0 8px;letter-spacing:.05em}
.study-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.study-choice{padding:14px 10px;border-radius:12px;border:1.5px solid #e0e0e0;background:#fff;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;text-align:center;color:#1d1d1f;line-height:1.4}
.study-choice:active{background:#f0f0f0}
.study-choice.correct{background:#f0fff4;border-color:#166534;color:#166534}
.study-choice.wrong{background:#fff0f0;border-color:#c0392b;color:#c0392b}
.study-feedback{padding:14px 16px;border-radius:12px;text-align:center;font-size:15px;font-weight:700;margin-bottom:16px;display:none}
.study-feedback.ok{background:#f0fff4;color:#166534}
.study-feedback.ng{background:#fff0f0;color:#c0392b}
.study-next{width:100%;padding:14px;border-radius:12px;border:none;background:#1d1d1f;color:#fff;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;display:none}
.study-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.study-progress-bar{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.study-progress-fill{height:100%;background:#1d1d1f;border-radius:3px;transition:width .3s}
.study-progress-text{font-size:13px;font-weight:700;color:#888;white-space:nowrap}
.study-result{text-align:center;padding:30px 20px}
.study-result-score{font-size:64px;font-weight:900;color:#1d1d1f;line-height:1}
.study-result-label{font-size:16px;color:#888;margin-top:8px;margin-bottom:24px}
.study-result-detail{font-size:14px;color:#555;margin-bottom:24px;line-height:1.8}
.study-result-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#1d1d1f;color:#fff;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;margin-bottom:10px}
.study-result-btn.sub{background:#f5f5f7;color:#1d1d1f}
/* flash card */
.flash-card{background:#fff;border-radius:16px;border:1px solid #e0e0e0;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 20px;margin-bottom:16px;cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}
.flash-card:active{background:#f8f8f8}

<script>
/* ================================================
   IndexedDB
================================================ */
var DB_NAME='eigoApp',DB_VER=1,DB_STORE='articles';
var db=null;

function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      e.target.result.createObjectStore(DB_STORE,{keyPath:'id'});
    };
    req.onsuccess=function(e){db=e.target.result;resolve(db);};
    req.onerror=function(e){reject(e);};
  });
}

function dbGetAll(){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).getAll();
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=reject;
  });
}

function dbPut(obj){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).put(obj);
    req.onsuccess=function(){resolve();};
    req.onerror=reject;
  });
}

function dbDelete(id){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).delete(id);
    req.onsuccess=function(){resolve();};
    req.onerror=reject;
  });
}
function dbGet(id){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).get(id);
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=reject;
  });
}

/* ================================================
   HOME
================================================ */
var allArticles=[];
var currentTag='all';
var BADGE_COLORS={'mlb':'badge-mlb','sg':'badge-sg','ai':'badge-ai','biz':'badge-biz','news':'badge-news'};

function selectTag(tag){
  currentTag=tag;
  document.querySelectorAll('.tag-chip').forEach(function(c){
    c.classList.toggle('on',c.dataset.tag===tag);
  });
  applyFilter();
}

function applyFilter(){
  var query=(document.getElementById('searchInput')||{value:''}).value.trim().toLowerCase();
  var filtered=allArticles.filter(function(a){
    var tagMatch=currentTag==='all'||a.badge===currentTag;
    var textMatch=!query||
      a.title.toLowerCase().includes(query)||
      (a.source||'').toLowerCase().includes(query)||
      a.date.includes(query)||
      (a.badgeLabel||'').toLowerCase().includes(query);
    return tagMatch&&textMatch;
  });
  renderArticleList(filtered);
}

function loadHome(){
  dbGetAll().then(function(rows){
    allArticles=rows.sort(function(a,b){return b.date.localeCompare(a.date);});

    var totalVocab=0;
    allArticles.forEach(function(a){
      try{var vd=Array.isArray(a.vd)?a.vd:(typeof a.vd==='string'?JSON.parse(a.vd):[]);totalVocab+=vd.length;}catch(e){}
    });
    document.getElementById('statArticles').textContent=allArticles.length;
    document.getElementById('statVocab').textContent=totalVocab;
    var months=new Set(allArticles.map(function(a){return a.date.substring(0,7);}));
    document.getElementById('statMonths').textContent=months.size;

    applyFilter();
  });
}

function renderArticleList(articles){
  var container=document.getElementById('articleList');
  container.innerHTML='';

  if(articles.length===0){
    container.innerHTML='<div class="empty-state"><div class="empty-icon">'+(allArticles.length===0?'📖':'🔍')+'</div><div class="empty-title">'+(allArticles.length===0?'記事がまだありません':'該当する記事がありません')+'</div><div class="empty-text">'+(allArticles.length===0?'「＋ 記事を追加」ボタンから<br>JSONファイルを選択してください':'検索条件を変えてみてください')+'</div></div>';
    return;
  }

  var monthMap={},monthOrder=[];
  articles.forEach(function(a){
    var ym=a.date.substring(0,7);
    if(!monthMap[ym]){monthMap[ym]=[];monthOrder.push(ym);}
    monthMap[ym].push(a);
  });

  var colors=['#1a5fa8','#166534','#4a3f8f','#c0392b','#92400e','#0369a1'];
  monthOrder.forEach(function(ym,mi){
    var arts=monthMap[ym];
    var parts=ym.split('-');
    var label=parts[0]+'年 '+parseInt(parts[1])+'月';
    var color=colors[mi%colors.length];
    var bodyId='m_'+ym.replace('-','');
    var arrId='ma_'+ym.replace('-','');

    var rowsHtml=arts.map(function(a){
      var dd=parseInt(a.date.substring(8,10));
      var mm=parseInt(a.date.substring(5,7));
      var badgeClass=BADGE_COLORS[a.badge]||'badge-mlb';
      return '<div class="art-row" onclick="openArticle(\''+a.id+'\')" ontouchstart="startLp(\''+a.id+'\')" ontouchend="cancelLp()" ontouchmove="cancelLp()">'+'<div class="art-date">'+mm+'月'+dd+'日</div>'+'<div class="art-right"><span class="art-badge '+badgeClass+'">'+esc(a.badgeLabel)+'</span>'+'<div class="art-title">'+esc(a.title)+'</div>'+'<div class="art-source">'+esc(a.source||'')+'</div></div>'+'<div class="art-arrow-icon">›</div></div>'
    }).join('');

    var card=document.createElement('div');
    card.className='month-card';
    card.innerHTML='<div class="month-head" onclick="toggleMonth(\''+bodyId+'\',\''+arrId+'\')">'
      +'<div class="month-left"><div class="month-dot" style="background:'+color+'"></div>'
      +'<div><div class="month-name">'+label+'</div><div class="month-count">'+arts.length+'記事</div></div></div>'
      +'<div class="month-arrow" id="'+arrId+'">›</div></div>'
      +'<div class="month-body" id="'+bodyId+'">'+rowsHtml+'</div>';
    container.appendChild(card);
  });

  if(monthOrder.length>0){
    var first=monthOrder[0];
    toggleMonth('m_'+first.replace('-',''),'ma_'+first.replace('-',''));
  }
}

function answerStudy(ci){
  var q=studyQuestions[studyIdx];
  var chosen=q.choices[ci];
  var ok=chosen===q.correct;
  if(ok)studyCorrect++;

  q.choices.forEach(function(c,i){
    var btn=document.getElementById('sc'+i);
    var wrap=document.getElementById('scw'+i);
    if(!btn)return;
    btn.disabled=true;
    if(c===q.correct){
      btn.className='study-choice correct';
      if(wrap)wrap.style.borderColor='#166534';
    }else if(i===ci){
      btn.className='study-choice wrong';
      if(wrap)wrap.style.borderColor='#c0392b';
    }
  });

  var fb=document.getElementById('studyFeedback');
  if(fb){
    fb.style.display='block';
    fb.className='study-feedback '+(ok?'ok':'ng');
    if(ok){
      fb.textContent='✓ 正解！';
    }else{
      fb.textContent='✗ 不正解。正解は「'+q.correct+'」';
    }
  }
  var nx=document.getElementById('studyNext');
  if(nx)nx.style.display='block';
}

function nextStudyQuestion(){
  studyIdx++;
  renderStudyQuestion();
}

function renderStudyResult(){
  var body=document.getElementById('studyBody');
  var total=studyQuestions.length;
  var pct=Math.round((studyCorrect/total)*100);
  var emoji=pct>=80?'🎉':pct>=60?'👍':'💪';
  body.innerHTML='<div class="study-result">'
    +'<div style="font-size:48px;margin-bottom:8px">'+emoji+'</div>'
    +'<div class="study-result-score">'+studyCorrect+' / '+total+'</div>'
    +'<div class="study-result-label">正解率 '+pct+'%</div>'
    +'<div class="study-result-detail">'+getModeLabel()+' 完了！</div>'
    +'<button class="study-result-btn" onclick="startStudy(studyMode)">もう一度</button>'
    +'<button class="study-result-btn sub" onclick="openStudyMenu()">別の学習をする</button>'
    +'<button class="study-result-btn sub" onclick="exitStudy()">記事一覧に戻る</button>'
    +'</div>';
  window.scrollTo(0,0);
}

function getModeLabel(){
  if(studyMode==='quiz')return '単語クイズ';
  if(studyMode==='fill')return '穴埋め問題';
  if(studyMode==='flash')return 'フラッシュカード';
  return '';
}

/* ================================================
   LONG PRESS（長押し編集）
================================================ */
var lpTimer=null, lpId=null, editMode='', editId=null;

function startLp(id){
  lpId=id;
  lpTimer=setTimeout(function(){
    lpTimer=null;
    openEditModal(id);
  },600);
}
function cancelLp(){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
}

function openEditModal(id){
  editId=id;
  dbGet(id).then(function(a){
    if(!a)return;
    // タイトルを短縮表示
    var short=a.title.length>30?a.title.substring(0,30)+'…':a.title;
    document.getElementById('editMenuTitle').textContent=short;
    document.getElementById('editConfirmTitle').textContent=short;
    // メニューを表示
    document.getElementById('editMenu').style.display='block';
    document.getElementById('editForm').style.display='none';
    document.getElementById('editConfirm').style.display='none';
    document.getElementById('editModal').classList.add('on');
  });
}

function closeEditModal(){
  document.getElementById('editModal').classList.remove('on');
  editId=null; editMode='';
}

function backToMenu(){
  document.getElementById('editMenu').style.display='block';
  document.getElementById('editForm').style.display='none';
  document.getElementById('editConfirm').style.display='none';
}

function openEditField(mode){
  editMode=mode;
  dbGet(editId).then(function(a){
    if(!a)return;
    var label=mode==='title'?'新しいタイトルを入力':'新しい日付を入力（例：2026-05-10）';
    var current=mode==='title'?a.title:a.date;
    document.getElementById('editFormTitle').textContent=label;
    var inp=document.getElementById('editInput');
    inp.value=current;
    inp.type=mode==='date'?'date':'text';
    document.getElementById('editMenu').style.display='none';
    document.getElementById('editForm').style.display='block';
    setTimeout(function(){inp.focus();},100);
  });
}

function doEdit(){
  var val=document.getElementById('editInput').value.trim();
  if(!val){return;}
  dbGet(editId).then(function(a){
    if(!a)return;
    if(editMode==='title')a.title=val;
    else if(editMode==='date')a.date=val;
    dbPut(a).then(function(){
      closeEditModal();
      showToast('✅ 更新しました');
      loadHome();
    });
  });
}

function confirmDelete(){
  document.getElementById('editMenu').style.display='none';
  document.getElementById('editConfirm').style.display='block';
}

function doDelete(){
  var tx=db.transaction('articles','readwrite');
  tx.objectStore('articles').delete(editId);
  tx.oncomplete=function(){
    closeEditModal();
    showToast('🗑️ 削除しました');
    loadHome();
  };
}

openDB().then(function(){loadHome();});
</script>
</body>
</html>
