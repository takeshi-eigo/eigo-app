<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>瞬間英作文</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f7f6f3;color:#1c1a17;font-family:-apple-system,'Helvetica Neue',sans-serif;min-height:100vh;max-width:480px;margin:0 auto}

/* TOP */
#topPage{display:flex;flex-direction:column;min-height:100vh}
.top-header{background:#fff;border-bottom:1px solid #eeece7;padding:20px 20px 16px}
.top-header h1{font-size:28px;font-weight:700;color:#1c1a17}
.top-date{font-size:12px;color:#b0ada4;margin-top:2px}
.search-row{display:flex;gap:8px;margin-top:14px}
.search-input{flex:1;min-width:0;padding:10px 14px;border:1.5px solid #e4e1d9;border-radius:10px;font-size:14px;background:#f7f6f3;color:#1c1a17;outline:none}
.search-input:focus{border-color:#2d6a4f}
.btn-add{flex-shrink:0;padding:10px 14px;border-radius:10px;border:none;background:#2d6a4f;color:#fff;font-size:13px;font-weight:500;cursor:pointer;touch-action:manipulation}
.theme-list{flex:1;padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-y:auto;align-content:start}
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;text-align:center;color:#b0ada4}
.empty-icon{font-size:48px}
.empty-title{font-size:16px;color:#6b6860;font-weight:500}
.empty-sub{font-size:13px;line-height:1.7}
.theme-card{background:#fff;border-radius:12px;border:1px solid #e4e1d9;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.05);touch-action:manipulation}
.theme-card.unplayed{border-color:#e8c99a;background:#fffbf5}
.theme-badge{font-size:10px;color:#b0ada4;letter-spacing:.03em}
.theme-badge.zero{color:#d4956a;font-weight:500}
.theme-icon{width:32px;height:32px;border-radius:8px;background:#eaf3ee;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.theme-name{font-size:13px;font-weight:500;color:#1c1a17;line-height:1.4;word-break:break-all}
.theme-meta{display:none}
.theme-arrow{display:none}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.on{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:8px}
.modal-sub{font-size:13px;color:#6b6860;line-height:1.7;margin-bottom:16px}
.file-pick-btn{width:100%;padding:24px;border-radius:12px;border:2px dashed #2d6a4f;background:#eaf3ee;color:#2d6a4f;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation;text-align:center;display:block}
.file-pick-btn:active{background:#d4ece0}
.modal-error{font-size:12px;color:#c0392b;margin-top:8px;display:none}
.modal-btns{margin-top:14px}
.btn-close{width:100%;padding:14px;border-radius:12px;border:1.5px solid #e4e1d9;background:#fff;font-size:14px;color:#6b6860;cursor:pointer;touch-action:manipulation}

/* STUDY */
#studyPage{display:none;flex-direction:column;min-height:100vh}
.study-header{background:#fff;border-bottom:1px solid #eeece7;padding:10px 20px;display:flex;align-items:center;gap:12px}
.btn-back{width:36px;height:36px;border-radius:50%;border:1.5px solid #e4e1d9;background:#fff;cursor:pointer;font-size:16px;flex-shrink:0;touch-action:manipulation}
.study-title{font-size:16px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.study-count{font-size:13px;color:#b0ada4;white-space:nowrap}
.progress-bar-wrap{background:#fff;padding:0 20px 8px}
.progress-dots{display:flex;gap:6px}
.dot{flex:1;height:3px;border-radius:2px;background:#e4e1d9;transition:background .3s}
.dot.done{background:#2d6a4f}
.dot.current{background:#b07d3a}
.card-area{flex:1;padding:8px 20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0}
.flashcard-wrap{width:100%;perspective:1000px}
.flashcard{width:100%;position:relative;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;min-height:100px}
.flashcard.flipped{transform:rotateY(180deg)}
@keyframes slideInRight{from{transform:translateX(40px) rotateY(-5deg);opacity:0}to{transform:translateX(0) rotateY(0);opacity:1}}
.flashcard.slide-in-right{animation:slideInRight .2s ease forwards}
.card-face{width:100%;background:#fff;border-radius:16px;border:1px solid #e4e1d9;box-shadow:0 8px 40px rgba(0,0,0,.10);padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-back{position:absolute;top:0;left:0;transform:rotateY(180deg)}
.face-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#b0ada4;margin-bottom:14px}
.scene-block{margin-bottom:10px;padding:8px 12px;background:#f7f6f3;border-radius:10px;border-left:3px solid #2d6a4f}
.scene-ja{font-size:13px;color:#6b6860;line-height:1.7;margin-bottom:4px}
.scene-en{font-size:12px;color:#b0ada4;line-height:1.7;font-style:italic}
.jp-sentence{font-size:22px;font-weight:500;color:#1c1a17;line-height:1.6;letter-spacing:.02em}
.tap-hint{margin-top:20px;font-size:12px;color:#b0ada4;text-align:center}
.back-section{margin-bottom:8px}
.back-section:last-child{margin-bottom:0}
.back-label{font-size:11px;font-weight:500;letter-spacing:.08em;margin-bottom:6px}
.back-label.correct{color:#2d6a4f}
.back-label.wrong{color:#c0392b}
.back-label.note{color:#b07d3a}
.en-answer{font-size:22px;font-weight:500;color:#1c1a17;line-height:1.6;width:100%;border:none;outline:none;background:transparent;resize:none;cursor:pointer;padding:0;overflow:hidden;font-family:-apple-system,'Helvetica Neue',sans-serif}
.wrong-ex{font-size:14px;color:#b0ada4;text-decoration:line-through;line-height:1.6}
.note-box{font-size:13px;color:#6b6860;line-height:1.8;padding:10px 12px;background:#fdf3e3;border-radius:8px;border-left:3px solid #b07d3a}
.divider{height:1px;background:#eeece7;margin:6px 0}
.study-btns{padding:6px 20px 24px;display:flex;flex-direction:column;gap:8px}
.btn-flip{width:100%;padding:20px;border-radius:14px;border:none;background:#2d6a4f;color:#fff;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation;letter-spacing:.05em}
.btn-next{width:100%;padding:20px;border-radius:14px;border:none;background:#2d6a4f;color:#fff;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation;letter-spacing:.05em}
.btn-back-top{width:100%;padding:20px;border-radius:14px;border:1.5px solid #2d6a4f;background:#fff;color:#2d6a4f;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation}

/* REVIEW */
#reviewPage{display:none;flex-direction:column;min-height:100vh}
.review-header{background:#fff;border-bottom:1px solid #eeece7;padding:20px;display:flex;align-items:center;gap:12px}
.review-title{font-size:22px;font-weight:700}
.review-body{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.review-card{background:#fff;border-radius:12px;border:1px solid #e4e1d9;padding:14px 16px}
.review-num{font-size:10px;color:#b0ada4;letter-spacing:.08em;margin-bottom:4px}
.review-scene-ja{font-size:11px;color:#b0ada4;line-height:1.5;margin-bottom:6px}
.review-jp{font-size:14px;font-weight:500;color:#1c1a17;margin-bottom:6px}
.review-en{font-size:16px;font-weight:500;color:#2d6a4f;margin-bottom:3px}
.review-wrong{font-size:12px;color:#b0ada4;text-decoration:line-through}
.review-footer{padding:16px 20px 36px;display:flex;flex-direction:column;gap:10px}
.btn-pdf{width:100%;padding:14px;border-radius:12px;border:1.5px solid #2d6a4f;background:#eaf3ee;color:#2d6a4f;font-size:14px;font-weight:500;cursor:pointer;touch-action:manipulation}
.btn-home{width:100%;padding:14px;border-radius:12px;border:1.5px solid #e4e1d9;background:#fff;color:#6b6860;font-size:14px;cursor:pointer;touch-action:manipulation}

.btn-speak{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;border:1.5px solid #2d6a4f;background:#eaf3ee;color:#2d6a4f;font-size:12px;font-weight:500;cursor:pointer;touch-action:manipulation}
.btn-speak:active{opacity:.8}
.btn-speak-sm{margin-top:6px;margin-bottom:8px}
.review-en-label{font-size:11px;font-weight:500;color:#2d6a4f;letter-spacing:.08em;margin-bottom:4px}
.review-en-text{width:100%;font-size:16px;font-weight:500;color:#1c1a17;border:none;outline:none;background:transparent;resize:none;cursor:pointer;padding:0;overflow:hidden;font-family:-apple-system,'Helvetica Neue',sans-serif;line-height:1.6}

/* PRINT */
@media print{
  @page{size:A4 portrait;margin:10mm}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:fixed;top:0;left:0;width:100%;font-family:sans-serif}
  .p-header{font-size:14px;font-weight:bold;color:#2d6a4f;border-bottom:2px solid #2d6a4f;padding-bottom:5px;margin-bottom:10px}
  .p-item{margin-bottom:8px;padding:7px 10px;border-left:2px solid #2d6a4f;background:#f9f9f7;page-break-inside:avoid}
  .p-num{font-size:9px;color:#aaa}
  .p-scene{font-size:9px;color:#999;margin:2px 0;line-height:1.4}
  .p-jp{font-size:12px;font-weight:500;margin:3px 0}
  .p-en{font-size:14px;font-weight:bold;color:#2d6a4f;margin:2px 0}
  .p-wrong{font-size:9px;color:#ccc;text-decoration:line-through}
  .p-note{font-size:9px;color:#777;margin-top:2px;line-height:1.4}
  .p-footer{font-size:9px;color:#bbb;text-align:right;margin-top:8px}
}
</style>
</head>
<body>

<!-- TOP -->
<div id="topPage">
  <div class="top-header">
    <h1>瞬間英作文</h1>
    <div class="top-date" id="topDate"></div>
    <div class="search-row">
      <input class="search-input" type="search" placeholder="テーマを検索..." id="searchInput" oninput="renderList()">
      <button class="btn-add" onclick="openImport()">＋ 問題を追加</button>
    </div>
  </div>
  <div class="theme-list" id="themeList"></div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-title">🗑️ 削除の確認</div>
    <div class="modal-sub">「<span id="deleteThemeName"></span>」を削除しますか？この操作は元に戻せません。</div>
    <div class="modal-btns" style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-close" onclick="closeDeleteModal()" style="flex:1">キャンセル</button>
      <button onclick="confirmDelete()" style="flex:1;padding:14px;border-radius:12px;border:none;background:#c0392b;color:#fff;font-size:14px;font-weight:500;cursor:pointer;touch-action:manipulation">削除する</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="importModal">
  <div class="modal-box">
    <div class="modal-title">📥 問題を追加</div>
    <div class="modal-sub">GeminiのGemで生成したJSONファイルを選択してください。複数まとめて選択すれば一括インポートできます。</div>
    <input type="file" id="fileInput" accept=".json" multiple style="display:none" onchange="handleFiles(this.files)">
    <button class="file-pick-btn" onclick="document.getElementById('fileInput').click()">
      📂 JSONファイルを選択<br><span style="font-size:12px;font-weight:400;opacity:.7">複数選択可</span>
    </button>
    <div class="modal-error" id="importError"></div>
    <div class="modal-btns">
      <button class="btn-close" onclick="closeImport()">閉じる</button>
    </div>
  </div>
</div>

<!-- STUDY -->
<div id="studyPage">
  <div class="study-header">
    <button class="btn-back" onclick="showPage('top')">←</button>
    <div class="study-title" id="studyTitle"></div>
    <div class="study-count" id="studyCount"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-dots" id="studyDots"></div>
  </div>
  <div style="padding:6px 20px 0">
    <button class="btn-flip" id="btnFlipTop" onclick="flipCard()" style="display:block">めくる</button>
    <button class="btn-back-top" id="btnBackTop" onclick="unflipCard()" style="display:none">← 表に戻る</button>
  </div>
  <div class="card-area">
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard">
        <div class="card-face" onclick="flipCard()">
          <div class="face-label">💬 日本語</div>
          <div class="scene-block">
            <div class="scene-ja" id="sceneJa"></div>
            <div class="scene-en" id="sceneEn"></div>
          </div>
          <div class="jp-sentence" id="jpSentence"></div>
          <div class="tap-hint">タップして英語を確認 →</div>
        </div>
        <div class="card-face card-back" onclick="handleBackTap(event)" style="cursor:pointer">
          <div class="face-label">🇬🇧 英語</div>
          <div class="back-section">
            <div class="back-label correct">✓ ネイティブはこう言う</div>
            <textarea class="en-answer" id="enAnswer" readonly onclick="event.stopPropagation();this.select()" rows="2"></textarea>
            <button class="btn-speak" onclick="event.stopPropagation();speakText(document.getElementById('enAnswer').value)">🔊 読み上げ</button>
          </div>
          <div class="divider"></div>
          <div class="back-section">
            <div class="back-label wrong">✗ 直訳しがち</div>
            <div class="wrong-ex" id="wrongEx"></div>
          </div>
          <div class="divider"></div>
          <div class="back-section">
            <div class="back-label note">💡 ポイント</div>
            <div class="note-box" id="noteBox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="study-btns">
    <button class="btn-flip" id="btnFlip" onclick="flipCard()">めくる</button>
    <button class="btn-next" id="btnNext" style="display:none" onclick="nextCard()">次の問題 →</button>
  </div>
</div>

<!-- REVIEW -->
<div id="reviewPage">
  <div class="review-header">
    <button class="btn-back" onclick="showPage('top')">←</button>
    <div class="review-title">振り返り</div>
  </div>
  <div class="review-body" id="reviewBody"></div>
  <div class="review-footer">
    <button class="btn-pdf" onclick="printPDF()">📄 PDFで保存</button>
    <button class="btn-home" onclick="showPage('top')">トップへ戻る</button>
  </div>
</div>

<script>
/* ================================================
   WakeLock
================================================ */
var wakeLock=null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    if(wakeLock) return;
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',function(){wakeLock=null;});
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){wakeLock.release();wakeLock=null;}
}
// タブ復帰時に再取得
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    var page=document.getElementById('studyPage');
    var review=document.getElementById('reviewPage');
    if(page&&page.style.display!=='none') requestWakeLock();
    else if(review&&review.style.display!=='none') requestWakeLock();
  } else {
    releaseWakeLock();
  }
});

/* ================================================
   IndexedDB - app.htmlと同じ方式
================================================ */
var DB_NAME='eikaiwaDB3', DB_VER=1, DB_STORE='themes';
var db=null;

function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains(DB_STORE)){
        d.createObjectStore(DB_STORE,{keyPath:'_id',autoIncrement:true});
      }
      if(!d.objectStoreNames.contains('counts')){
        d.createObjectStore('counts',{keyPath:'id'});
      }
    };
    req.onsuccess=function(e){db=e.target.result;resolve(db);};
    req.onerror=function(e){reject(e);};
  });
}

function dbGetAll(){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).getAll();
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=reject;
  });
}

function dbAdd(obj){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).add(obj);
    req.onsuccess=function(){resolve();};
    req.onerror=reject;
  });
}

/* ================================================
   STATE
================================================ */
var allThemes=[];
var currentTheme=null;
var currentIdx=0;
var isFlipped=false;

/* ================================================
   TOP PAGE
================================================ */
function getCounts(){
  return new Promise(function(resolve){
    try{
      var tx=db.transaction('counts','readonly');
      var req=tx.objectStore('counts').getAll();
      req.onsuccess=function(){
        var map={};
        (req.result||[]).forEach(function(r){map[r.id]=r.count;});
        resolve(map);
      };
      req.onerror=function(){resolve({});};
    }catch(e){resolve({});}
  });
}

function incrementCount(themeId){
  try{
    var tx=db.transaction('counts','readwrite');
    var store=tx.objectStore('counts');
    var req=store.get(themeId);
    req.onsuccess=function(){
      var cur=req.result||{id:themeId,count:0};
      cur.count++;
      store.put(cur);
    };
  }catch(e){}
}

var playCounts={};

function dbDelete(id){
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).delete(id);
    req.onsuccess=function(){resolve();};
    req.onerror=reject;
  });
}

function loadHome(){
  dbGetAll().then(function(themes){
    allThemes=themes;
    getCounts().then(function(counts){
      playCounts=counts;
      renderList();
    });
  });
}

function renderList(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var filtered=q ? allThemes.filter(function(t){return t.theme.toLowerCase().indexOf(q)>=0;}) : allThemes;
  var list=document.getElementById('themeList');
  if(filtered.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-title">'+(q?'該当するテーマがありません':'問題がまだありません')+'</div><div class="empty-sub">'+(q?'別のキーワードで検索してみてください。':'「＋ 問題を追加」ボタンからJSONを追加してください。')+'</div></div>';
    return;
  }
  var sorted=filtered.slice().reverse();
  var cards=sorted.map(function(t){
    var cnt=playCounts[t._id]||0;
    var unplayed=cnt===0?' unplayed':'';
    var badgeClass=cnt===0?' zero':'';
    var badgeText=cnt===0?'未学習':cnt+'回';
    var div=document.createElement('div');
    div.className='theme-card'+unplayed;
    div.dataset.id=t._id;
    div.dataset.name=t.theme;
    div.innerHTML='<div class="theme-icon">'+getIcon(t.theme)+'</div><div class="theme-name">'+t.theme+'</div><div class="theme-badge'+badgeClass+'">'+badgeText+'</div>';
    div.addEventListener('click',function(){startStudy(t._id);});
    var timer=null;
    div.addEventListener('touchstart',function(){timer=setTimeout(function(){showDeleteDialog(t._id,t.theme);},600);},{passive:true});
    div.addEventListener('touchend',function(){clearTimeout(timer);});
    div.addEventListener('touchmove',function(){clearTimeout(timer);});
    return div;
  });
  list.innerHTML='';
  cards.forEach(function(c){list.appendChild(c);});
}

/* ================================================
   LONG PRESS DELETE
================================================ */
var longPressTimer=null;
var longPressId=null;
var longPressName=null;

function handleTouchStart(e,id,name){
  longPressId=id;
  longPressName=name;
  longPressTimer=setTimeout(function(){
    showDeleteDialog(id,name);
  },600);
}
function handleTouchEnd(){
  clearTimeout(longPressTimer);
  longPressTimer=null;
}

function showDeleteDialog(id,name){
  document.getElementById('deleteThemeName').textContent=name;
  document.getElementById('deleteModal').classList.add('on');
  document.getElementById('deleteModal').dataset.targetId=id;
}
function closeDeleteModal(){
  document.getElementById('deleteModal').classList.remove('on');
}
function confirmDelete(){
  var id=parseInt(document.getElementById('deleteModal').dataset.targetId);
  dbDelete(id).then(function(){
    closeDeleteModal();
    loadHome();
  });
}

/* ================================================
   ICON
================================================ */
function getIcon(theme){
  var t=theme;
  if(/タクシー|車|ドライブ/.test(t)) return '🚕';
  if(/ホテル|チェックイン|宿/.test(t)) return '🏨';
  if(/飛行機|空港|フライト/.test(t)) return '✈️';
  if(/レストラン|食事|ランチ|ディナー|カフェ/.test(t)) return '🍽️';
  if(/ホーカー|屋台|フード/.test(t)) return '🍜';
  if(/会議|ミーティング|プレゼン|発言/.test(t)) return '💼';
  if(/商談|ビジネス|交渉/.test(t)) return '🤝';
  if(/名刺|アイスブレイク/.test(t)) return '🪪';
  if(/友人|再会|友達/.test(t)) return '👋';
  if(/病院|薬局|症状|医/.test(t)) return '🏥';
  if(/世間話|雑談|スモールトーク/.test(t)) return '💬';
  if(/電話|Zoom|オンライン/.test(t)) return '📞';
  if(/ショッピング|買い物/.test(t)) return '🛍️';
  if(/困|緊急|トラブル/.test(t)) return '🆘';
  if(/シンガポール/.test(t)) return '🇸🇬';
  return '📖';
}

/* ================================================
   IMPORT
================================================ */
function openImport(){
  document.getElementById('fileInput').value='';
  document.getElementById('importError').style.display='none';
  document.getElementById('importModal').classList.add('on');
}

function closeImport(){
  document.getElementById('importModal').classList.remove('on');
  loadHome();
}

function handleFiles(files){
  if(!files||files.length===0)return;
  var total=files.length;
  var done=0, errors=[];

  Array.from(files).forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var raw=e.target.result.replace(/```json|```/g,'').trim();
        var data=JSON.parse(raw);
        if(!data.theme||!Array.isArray(data.cards)||data.cards.length===0){
          errors.push(file.name+': theme と cards が必要です');
          done++; checkDone();return;
        }
        dbAdd(data).then(function(){
          done++; checkDone();
        }).catch(function(){
          errors.push(file.name+': 保存エラー');
          done++; checkDone();
        });
      }catch(err){
        errors.push(file.name+': JSON解析エラー');
        done++; checkDone();
      }
    };
    reader.readAsText(file,'utf-8');
  });

  function checkDone(){
    if(done<total)return;
    var errEl=document.getElementById('importError');
    if(errors.length>0){
      errEl.textContent=errors.join('\n');
      errEl.style.display='block';
    } else {
      closeImport();
    }
  }
}

/* ================================================
   STUDY
================================================ */
function startStudy(id){
  var found=null;
  for(var i=0;i<allThemes.length;i++){
    if(allThemes[i]._id===id){found=allThemes[i];break;}
  }
  if(!found)return;
  currentTheme=found;
  currentIdx=0;
  isFlipped=false;
  document.getElementById('studyTitle').textContent=currentTheme.theme;
  buildDots();
  renderCard(0);
  showPage('study');
}

function buildDots(){
  var total=currentTheme.cards.length;
  var html='';
  for(var i=0;i<total;i++){
    html+='<div class="dot'+(i===0?' current':'') +'" id="sdot'+i+'"></div>';
  }
  document.getElementById('studyDots').innerHTML=html;
}

function updateDots(idx){
  var total=currentTheme.cards.length;
  for(var i=0;i<total;i++){
    var d=document.getElementById('sdot'+i);
    if(!d)continue;
    d.className='dot'+(i<idx?' done':i===idx?' current':'');
  }
  document.getElementById('studyCount').textContent=(idx+1)+' / '+total;
}

function renderCard(idx){
  var card=currentTheme.cards[idx];
  if(!card)return;
  isFlipped=false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('btnFlip').style.display='block';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnFlipTop').style.display='block';
  document.getElementById('btnBackTop').style.display='none';
  document.getElementById('sceneJa').textContent=card.scene_ja||'';
  document.getElementById('sceneEn').textContent=card.scene_en||'';
  document.getElementById('jpSentence').textContent=card.japanese||'';
  document.getElementById('enAnswer').value=card.english||'';
  document.getElementById('wrongEx').textContent=card.wrong_example||'';
  document.getElementById('noteBox').textContent=card.note||'';
  var ta=document.getElementById('enAnswer');
  setTimeout(function(){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';},100);
  updateDots(idx);
}

function flipCard(){
  if(!isFlipped){
    isFlipped=true;
    document.getElementById('flashcard').classList.add('flipped');
    document.getElementById('btnFlip').style.display='none';
    document.getElementById('btnNext').style.display='block';
    document.getElementById('btnFlipTop').style.display='none';
    document.getElementById('btnBackTop').style.display='block';
  }
}

function handleBackTap(e){
  if(e.target.tagName==='TEXTAREA') return;
  if(e.target.tagName==='BUTTON') return;
  nextCard();
}

function unflipCard(){
  if(isFlipped){
    isFlipped=false;
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('btnFlip').style.display='block';
    document.getElementById('btnNext').style.display='none';
    document.getElementById('btnFlipTop').style.display='block';
    document.getElementById('btnBackTop').style.display='none';
  }
}

function nextCard(){
  currentIdx++;
  if(currentIdx>=currentTheme.cards.length){
    showReview();
  } else {
    var card=document.getElementById('flashcard');
    card.classList.remove('slide-in-right','flipped');
    renderCard(currentIdx);
    void card.offsetWidth;
    card.classList.add('slide-in-right');
    setTimeout(function(){card.classList.remove('slide-in-right');},220);
  }
}

/* ================================================
   REVIEW
================================================ */
function showReview(){
  incrementCount(currentTheme._id);
  playCounts[currentTheme._id]=(playCounts[currentTheme._id]||0)+1;
  var html='';
  for(var i=0;i<currentTheme.cards.length;i++){
    var c=currentTheme.cards[i];
    html+='<div class="review-card"><div class="review-num">Q'+(i+1)+'</div><div class="review-scene-ja">🎬 '+(c.scene_ja||'')+'</div><div class="review-jp">'+(c.japanese||'')+'</div><div class="review-en-label">✅ ネイティブはこう言う</div><textarea class="review-en-text" readonly onclick="this.select()">'+(c.english||'')+'</textarea><button class="btn-speak btn-speak-sm" onclick="speakText(this.previousElementSibling.value)">🔊 読み上げ</button><div class="review-wrong">❌ '+(c.wrong_example||'')+'</div></div>';
  }
  document.getElementById('reviewBody').innerHTML=html;
  showPage('review');
}

function printPDF(){
  var el=document.getElementById('printArea');
  if(el)el.remove();
  var dateStr=new Date().toLocaleDateString('ja-JP');
  var items='';
  for(var i=0;i<currentTheme.cards.length;i++){
    var c=currentTheme.cards[i];
    items+='<div class="p-item"><div class="p-num">Q'+(i+1)+'</div><div class="p-scene">'+(c.scene_ja||'')+'</div><div class="p-jp">'+(c.japanese||'')+'</div><div class="p-en">'+(c.english||'')+'</div><div class="p-wrong">'+(c.wrong_example||'')+'</div><div class="p-note">💡 '+(c.note||'')+'</div></div>';
  }
  var div=document.createElement('div');
  div.id='printArea';
  div.innerHTML='<div class="p-header">瞬間英作文 ─ '+currentTheme.theme+'</div>'+items+'<div class="p-footer">'+dateStr+'</div>';
  document.body.appendChild(div);
  window.print();
}

/* ================================================
   PAGE ROUTING
================================================ */
function showPage(page){
  document.getElementById('topPage').style.display=page==='top'?'flex':'none';
  document.getElementById('studyPage').style.display=page==='study'?'flex':'none';
  document.getElementById('reviewPage').style.display=page==='review'?'flex':'none';
  if(page==='top'){loadHome();releaseWakeLock();}
  else{requestWakeLock();}
}

/* ================================================
   SPEAK
================================================ */
function speakText(text){
  if(!text)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=0.9;
  window.speechSynthesis.speak(u);
}
