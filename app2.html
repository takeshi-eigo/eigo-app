<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語学習">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>英語学習アプリ v2</title>
<style>
/* スタイル部分は既存の app.html と同一です */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#f0f2f5;color:#1d1d1f;font-size:16px;overscroll-behavior:none}
.screen{display:none;min-height:100vh}
.screen.on{display:block}
.home-hdr{background:#1d1d1f;padding:20px 16px 14px;position:sticky;top:0;z-index:100}
.search-bar{display:flex;gap:8px;margin-top:12px}
.search-input{flex:1;padding:10px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:14px;outline:none;-webkit-appearance:none}
.search-input::placeholder{color:rgba(255,255,255,.4)}
.tag-bar{display:flex;overflow-x:auto;gap:7px;padding:10px 14px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tag-chip{font-size:12px;padding:5px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;white-space:nowrap;font-weight:600;flex-shrink:0}
.tag-chip.on{background:rgba(255,255,255,.9);color:#1d1d1f;border-color:transparent}
.home-hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.home-hdr-icon{font-size:24px}
.home-hdr-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}
.stats-row{display:flex;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.home-body{padding:14px}
.import-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#2c3e50;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px}
.month-card{background:#fff;border-radius:14px;border:1px solid #e0e0e0;margin-bottom:12px;overflow:hidden}
.month-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
.month-left{display:flex;align-items:center;gap:10px}
.month-dot{width:10px;height:10px;border-radius:50%}
.month-name{font-size:17px;font-weight:700}
.month-count{font-size:12px;color:#aaa}
.month-arrow{font-size:18px;color:#ccc;transition:transform .2s}
.month-arrow.open{transform:rotate(90deg)}
.month-body{display:none;border-top:1px solid #f0f0f0}
.month-body.open{display:block}
.art-row{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #f5f5f5;gap:12px;cursor:pointer}
.art-date{font-size:12px;font-weight:700;color:#aaa;min-width:44px}
.art-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;margin-bottom:5px}
.art-title{font-size:14px;font-weight:600;line-height:1.45}
.badge-mlb{background:#e8f0fb;color:#1a5fa8}
.badge-sg{background:#fde8e8;color:#c0392b}
.badge-ai{background:#ede9fe;color:#4a3f8f}
.badge-biz{background:#fef3c7;color:#92400e}
.badge-news{background:#dcfce7;color:#166534}
/* モーダル・トースト等 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.modal-overlay.on{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:85vh;overflow-y:auto}
.file-pick-btn{width:100%;padding:18px;border-radius:12px;border:2px dashed #1a5fa8;background:#f0f5fb;color:#1a5fa8;font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
:root { --theme: #1a5fa8; --theme-bg: rgba(26, 95, 168, 0.07); --theme-bg-strong: rgba(26, 95, 168, 0.12); }
</style>
</head>
<body>

<div class="screen on" id="screenHome">
  <div class="home-hdr">
    <div class="home-hdr-top">
      <span class="home-hdr-icon">📚</span>
      <div>
        <div class="home-hdr-title">英語学習アプリ v2</div>
        <div style="font-size:13px;color:#888;">Auto-Sync Enabled</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="statArticles">0</div><div class="stat-lbl">記事数</div></div>
      <div class="stat"><div class="stat-num" id="statVocab">0</div><div class="stat-lbl">単語数</div></div>
      <div class="stat"><div class="stat-num" id="statMonths">0</div><div class="stat-lbl">ヶ月分</div></div>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" type="search" placeholder="🔍 記事を検索..." oninput="applyFilter()">
    </div>
    <div class="tag-bar" id="tagBar">
      <div class="tag-chip on" data-tag="all" onclick="selectTag('all')">すべて</div>
      <div class="tag-chip" data-tag="mlb" onclick="selectTag('mlb')">⚾ MLB</div>
      <div class="tag-chip" data-tag="news" onclick="selectTag('news')">🌍 World</div>
    </div>
  </div>
  <div class="home-body">
    <button class="import-btn" onclick="openImport()">＋ 記事を追加（手動）</button>
    <div id="articleList"></div>
  </div>
</div>

<div class="modal-overlay" id="importModal">
  <div class="modal-box">
    <div class="modal-title" style="font-weight:800;font-size:18px;margin-bottom:10px;">📥 記事を追加</div>
    <input type="file" id="fileInput" accept=".json" multiple style="display:none" onchange="handleFiles(this.files)">
    <button class="file-pick-btn" onclick="document.getElementById('fileInput').click()">📂 JSONファイルを選択</button>
    <div id="importResult" style="padding:10px;border-radius:8px;display:none;"></div>
    <button class="modal-btn-cancel" style="width:100%;padding:12px;margin-top:10px;" onclick="closeImport()">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================
    IndexedDB Logic
================================================ */
var DB_NAME='eigoAppV2',DB_VER=1,DB_STORE='articles';
var db=null;

async function openDB(){
  return new Promise((resolve,reject)=>{
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(DB_STORE,{keyPath:'id'});
    req.onsuccess=e=>{db=e.target.result;resolve(db);};
    req.onerror=e=>reject(e);
  });
}

function dbGetAll(){
  return new Promise((resolve,reject)=>{
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=reject;
  });
}

function dbPut(obj){
  return new Promise((resolve,reject)=>{
    var tx=db.transaction(DB_STORE,'readwrite');
    var req=tx.objectStore(DB_STORE).put(obj);
    req.onsuccess=()=>resolve();
    req.onerror=reject;
  });
}

/* ================================================
    Auto-Sync Logic (GitHub上のファイルを読み込む)
================================================ */
// あなたのリポジトリにあるファイル名のリスト
const INITIAL_FILES = [
  'articles/ohtani_44streak_april11.json',
  'articles/ohtani_bat_waking_april27.json',
  'articles/ohtani_degrom_april13.json',
  'articles/ohtani_era038_april23.json',
  'articles/ohtani_pitcher_only_april16.json',
  'articles/rojas_100hits_april21.json',
  'articles/trout_judge_april14.json'
];

async function syncArticles() {
  showToast("記事を同期中...");
  let count = 0;
  for (const path of INITIAL_FILES) {
    try {
      const res = await fetch(path);
      if (!res.ok) continue;
      const data = await res.json();
      
      // 文字列化が必要な箇所の処理
      if(Array.isArray(data.art)) data.art = JSON.stringify(data.art);
      if(Array.isArray(data.vd)) data.vd = JSON.stringify(data.vd);
      if(Array.isArray(data.gd)) data.gd = JSON.stringify(data.gd);
      
      await dbPut(data);
      count++;
    } catch (e) {
      console.error("Sync failed for: " + path, e);
    }
  }
  if(count > 0) {
    showToast(count + "件の記事を読み込みました");
    loadHome();
  }
}

/* ================================================
    UI Logic
================================================ */
var allArticles=[];
var currentTag='all';

async function loadHome(){
  const rows = await dbGetAll();
  if (rows.length === 0) {
    // 記事が空なら同期実行
    await syncArticles();
    return;
  }
  allArticles=rows.sort((a,b)=>b.date.localeCompare(a.date));
  renderStats();
  applyFilter();
}

function renderStats() {
  let totalVocab = 0;
  allArticles.forEach(a => {
    try {
      const vd = typeof a.vd === 'string' ? JSON.parse(a.vd) : (a.vd || []);
      totalVocab += vd.length;
    } catch(e){}
  });
  document.getElementById('statArticles').textContent = allArticles.length;
  document.getElementById('statVocab').textContent = totalVocab;
  const months = new Set(allArticles.map(a => a.date.substring(0,7)));
  document.getElementById('statMonths').textContent = months.size;
}

function applyFilter(){
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allArticles.filter(a => {
    const tagMatch = currentTag === 'all' || a.badge === currentTag;
    const textMatch = a.title.toLowerCase().includes(query);
    return tagMatch && textMatch;
  });
  renderArticleList(filtered);
}

function renderArticleList(articles){
  const container = document.getElementById('articleList');
  container.innerHTML = '';
  if(articles.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">記事が見つかりません</div>';
    return;
  }
  
  articles.forEach(a => {
    const div = document.createElement('div');
    div.className = 'art-row';
    div.style.background = '#fff';
    div.style.margin = '8px 0';
    div.style.borderRadius = '10px';
    div.style.padding = '15px';
    div.innerHTML = `
      <div class="art-date">${a.date.substring(5)}</div>
      <div class="art-right">
        <span class="art-badge badge-mlb">${a.badgeLabel || 'News'}</span>
        <div class="art-title">${a.title}</div>
      </div>
    `;
    // 詳細画面への遷移は元のアプリの openArticle などのロジックに合わせて実装してください
    container.appendChild(div);
  });
}

function selectTag(tag){
  currentTag = tag;
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.toggle('on', c.dataset.tag === tag));
  applyFilter();
}

function openImport() { document.getElementById('importModal').classList.add('on'); }
function closeImport() { document.getElementById('importModal').classList.remove('on'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// 起動
(async () => {
  await openDB();
  loadHome();
})();

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}
</script>
</body>
</html>
