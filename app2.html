<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英語学習アプリ v2 (Full Sync)</title>
<style>
/* スタイル */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#f0f2f5;color:#1d1d1f;font-size:16px}
.screen{display:none;min-height:100vh}
.screen.on{display:block}
.home-hdr{background:#1d1d1f;padding:20px 16px 14px;position:sticky;top:0;z-index:100}
.home-hdr-title{font-size:20px;font-weight:800;color:#fff}
.stats-row{display:flex;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#888}
.search-input{width:100%;padding:10px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.12);color:#fff;margin-top:12px;outline:none}
.tag-bar{display:flex;gap:7px;padding:10px 14px 0;overflow-x:auto}
.tag-chip{font-size:12px;padding:5px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);color:#fff;white-space:nowrap}
.tag-chip.on{background:#fff;color:#1d1d1f;border-color:transparent}
.home-body{padding:14px}
.import-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#2c3e50;color:#fff;font-weight:700;margin-bottom:14px}
.art-row{display:flex;align-items:center;padding:15px;background:#fff;border-radius:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.art-date{font-size:12px;color:#aaa;min-width:44px;font-weight:700}
.art-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;margin-bottom:4px;display:inline-block}
.badge-mlb{background:#e8f0fb;color:#1a5fa8}
.badge-news{background:#dcfce7;color:#166534}
.art-title{font-size:14px;font-weight:600;line-height:1.4}
/* 詳細画面用 */
.detail-hdr{background:#fff;padding:16px;position:sticky;top:0;display:flex;align-items:center;border-bottom:1px solid #eee}
.btn-back{background:none;border:none;font-size:18px;margin-right:10px}
#art-content{padding:20px;background:#fff;line-height:1.8}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="screen on" id="screenHome">
  <div class="home-hdr">
    <div class="home-hdr-title">英語学習アプリ v2</div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="statArticles">0</div><div class="stat-lbl">記事数</div></div>
      <div class="stat"><div class="stat-num" id="statVocab">0</div><div class="stat-lbl">単語数</div></div>
    </div>
    <input class="search-input" id="searchInput" type="search" placeholder="🔍 記事を検索..." oninput="applyFilter()">
    <div class="tag-bar">
      <div class="tag-chip on" data-tag="all" onclick="selectTag('all')">すべて</div>
      <div class="tag-chip" data-tag="mlb" onclick="selectTag('mlb')">⚾ MLB</div>
    </div>
  </div>
  <div class="home-body">
    <button class="import-btn" onclick="syncArticles()">🔄 全記事を再同期</button>
    <div id="articleList"></div>
  </div>
</div>

<div class="screen" id="screenDetail">
  <div class="detail-hdr">
    <button class="btn-back" onclick="showHome()">←</button>
    <div id="detail-title" style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">記事詳細</div>
  </div>
  <div id="art-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var DB_NAME='eigoAppV2',DB_VER=1,DB_STORE='articles';
var db=null;
var allArticles=[];
var currentTag='all';

// 1. GitHub上の全ファイルリスト（17ファイル以上）
const INITIAL_FILES = [
  'articles/anthropic_claude_word.json',
  'articles/dengue_urine_test.json',
  'articles/hormuz_blockade_april13.json',
  'articles/muncy_3hr_april11.json',
  'articles/ohtani_44streak_april11.json',
  'articles/ohtani_bat_waking_april27.json',
  'articles/ohtani_degrom_april13.json',
  'articles/ohtani_era038_april23.json',
  'articles/ohtani_pitcher_only_april16.json',
  'articles/rojas_100hits_april21.json',
  'articles/singapore_vending_straw.json',
  'articles/singapore_ai_neutral_april24.json',
  'articles/singapore_vape_smuggling.json',
  'articles/skenes_perfect_april25.json',
  'articles/trout_judge_april14.json',
  'articles/whca_shooting_april26.json',
  'articles/yuki_miura_farewell.json'
];

async function openDB(){
  return new Promise((resolve)=>{
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(DB_STORE,{keyPath:'id'});
    req.onsuccess=e=>{db=e.target.result;resolve();};
  });
}

async function syncArticles() {
  showToast("記事を同期中...");
  for (const path of INITIAL_FILES) {
    try {
      const res = await fetch(path);
      if (res.ok) {
        const data = await res.json();
        const tx=db.transaction(DB_STORE,'readwrite');
        tx.objectStore(DB_STORE).put(data);
      }
    } catch (e) {}
  }
  showToast("同期完了");
  loadHome();
}

async function loadHome(){
  const tx=db.transaction(DB_STORE,'readonly');
  const rows = await new Promise(r => {
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => r(req.result);
  });
  
  if (rows.length === 0) { await syncArticles(); return; }
  
  allArticles=rows.sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('statArticles').textContent = allArticles.length;
  applyFilter();
}

function applyFilter(){
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allArticles.filter(a => {
    const tagMatch = currentTag === 'all' || a.badge === currentTag;
    return tagMatch && a.title.toLowerCase().includes(query);
  });
  renderList(filtered);
}

function renderList(articles){
  const container = document.getElementById('articleList');
  container.innerHTML = articles.map(a => `
    <div class="art-row" onclick="openArticle('${a.id}')">
      <div class="art-date">${a.date.substring(5)}</div>
      <div>
        <span class="art-badge badge-${a.badge}">${a.badgeLabel}</span>
        <div class="art-title">${a.title}</div>
      </div>
    </div>
  `).join('');
}

function openArticle(id) {
  const art = allArticles.find(a => a.id === id);
  if(!art) return;
  document.getElementById('detail-title').textContent = art.title;
  // 本文表示（簡易版）
  const body = typeof art.art === 'string' ? JSON.parse(art.art) : art.art;
  document.getElementById('art-content').innerHTML = body.map(p => `<p style="margin-bottom:1em">${p.en}<br><span style="color:#666;font-size:0.9em">${p.ja}</span></p>`).join('');
  
  document.getElementById('screenHome').classList.remove('on');
  document.getElementById('screenDetail').classList.add('on');
  window.scrollTo(0,0);
}

function showHome() {
  document.getElementById('screenDetail').classList.remove('on');
  document.getElementById('screenHome').classList.add('on');
}

function selectTag(tag){
  currentTag = tag;
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.toggle('on', c.dataset.tag === tag));
  applyFilter();
}

function showToast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

(async()=>{ await openDB(); loadHome(); })();
</script>
</body>
</html>
