<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOEIC Part 5 トレーニング</title>
<style>
:root{
  --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222e;--surface3:#2a2a38;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0eee8;--muted:#888;--muted2:#aaa;
  --accent:#4f8ef7;--accent2:#7c5cbf;
  --correct:#3dba7e;--wrong:#e05252;--warn:#e8a030;
  --font:'Georgia',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* ── HEADER ── */
.hdr{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.hdr-back{background:none;border:none;color:var(--muted2);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.hdr-back:hover{color:var(--text)}
.hdr-title{font-size:17px;font-family:var(--sans);font-weight:600;flex:1}
.hdr-action{background:none;border:1px solid var(--border2);border-radius:8px;
  color:var(--muted2);font-size:13px;font-family:var(--sans);padding:6px 14px;cursor:pointer}
.hdr-action:hover{border-color:var(--accent);color:var(--accent)}

/* ── HOME SCREEN ── */
#screen-home{padding:0}
.home-hero{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  padding:32px 20px 24px;text-align:center;border-bottom:1px solid var(--border);
}
.hero-badge{
  display:inline-block;background:var(--accent);color:#fff;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  padding:3px 12px;border-radius:2px;margin-bottom:12px;font-family:var(--sans);
}
.hero-title{font-size:28px;font-weight:normal;line-height:1.2;margin-bottom:6px}
.hero-sub{font-size:13px;color:var(--muted);font-family:var(--sans)}
.home-body{padding:16px;flex:1}
.section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;margin-top:8px;
}
.section-title{font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;font-family:var(--sans)}
.btn-add{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:8px 16px;font-size:13px;font-family:var(--sans);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.btn-add:hover{opacity:0.85}
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;cursor:pointer;transition:all .15s;position:relative;
  min-height:120px;display:flex;flex-direction:column;
}
.tile:hover{border-color:var(--border2);transform:translateY(-1px)}
.tile:active{transform:scale(0.97)}
.tile-icon{font-size:24px;margin-bottom:8px}
.tile-name{font-size:14px;font-family:var(--sans);font-weight:600;
  line-height:1.3;margin-bottom:auto;padding-bottom:10px}
.tile-meta{display:flex;flex-direction:column;gap:3px}
.tile-date{font-size:10px;color:var(--muted);font-family:var(--sans)}
.tile-count{font-size:10px;color:var(--muted);font-family:var(--sans)}
.tile-count span{color:var(--accent);font-weight:600}
.tile-demo{border-style:dashed;border-color:var(--accent);opacity:0.7}
.tile-demo .tile-icon{opacity:0.7}
.empty-state{
  text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--sans);font-size:14px;
}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4}

/* Long-press context menu */
.ctx-overlay{
  display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);
  align-items:center;justify-content:center;
}
.ctx-overlay.open{display:flex}
.ctx-menu{
  background:var(--surface2);border:1px solid var(--border2);border-radius:16px;
  width:280px;overflow:hidden;
}
.ctx-header{padding:16px;border-bottom:1px solid var(--border);text-align:center}
.ctx-header p{font-size:14px;font-family:var(--sans);color:var(--muted2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-btn{
  width:100%;background:none;border:none;border-bottom:1px solid var(--border);
  padding:16px;font-size:15px;font-family:var(--sans);color:var(--text);
  cursor:pointer;text-align:center;display:block;
}
.ctx-btn:last-child{border-bottom:none}
.ctx-btn:hover{background:var(--surface3)}
.ctx-btn.danger{color:var(--wrong)}
.ctx-btn.cancel{color:var(--muted)}

/* Edit overlay */
.edit-overlay{
  display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);
  align-items:center;justify-content:center;padding:20px;
}
.edit-overlay.open{display:flex}
.edit-box{
  background:var(--surface2);border:1px solid var(--border2);border-radius:16px;
  padding:20px;width:100%;max-width:320px;
}
.edit-box h3{font-size:16px;font-family:var(--sans);margin-bottom:12px;font-weight:600}
.edit-input{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:8px;padding:10px 12px;font-size:15px;font-family:var(--sans);
  color:var(--text);margin-bottom:12px;
}
.edit-input:focus{outline:none;border-color:var(--accent)}
.edit-row{display:flex;gap:10px}
.edit-row button{flex:1;border:none;border-radius:8px;padding:10px;
  font-size:14px;font-family:var(--sans);cursor:pointer}
.edit-cancel{background:var(--surface3);color:var(--muted2)}
.edit-ok{background:var(--accent);color:#fff}

/* ── QUIZ SCREEN ── */
#screen-quiz{background:var(--bg)}
.quiz-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.q-counter{font-size:13px;color:var(--muted);font-family:var(--sans)}
.q-counter strong{color:var(--text);font-size:16px}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.timer-num{
  font-size:28px;font-weight:bold;font-family:'Courier New',monospace;
  min-width:44px;text-align:center;transition:color .3s;
}
.timer-num.warn{color:var(--warn)}
.timer-num.danger{color:var(--wrong)}
.timer-bar-wrap{width:100px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.timer-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .9s linear,background .3s}
.timer-bar.warn{background:var(--warn)}
.timer-bar.danger{background:var(--wrong)}
.score-live{font-size:13px;color:var(--muted);font-family:var(--sans);text-align:right}
.score-live strong{color:var(--correct)}
.quiz-body{
  flex:1;padding:20px 16px;overflow-y:auto;
  max-width:680px;width:100%;margin:0 auto;
}
.q-sentence{
  font-size:clamp(16px,3vw,20px);line-height:1.9;margin-bottom:24px;
  padding-bottom:16px;border-bottom:1px solid var(--border);
}
.blank{
  display:inline-block;min-width:110px;border-bottom:2px solid var(--accent);
  text-align:center;color:var(--accent);font-style:italic;
}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;text-align:left;cursor:pointer;
  font-size:15px;font-family:var(--font);color:var(--text);
  transition:all .12s;display:flex;align-items:center;gap:12px;width:100%;
}
.choice-btn:hover{border-color:var(--border2);background:var(--surface2)}
.choice-btn:active{transform:scale(0.99)}
.choice-btn.selected{border-color:var(--accent);background:rgba(79,142,247,0.12)}
.choice-label{
  width:26px;height:26px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-family:var(--sans);flex-shrink:0;
}
.progress-foot{height:3px;background:var(--surface2);flex-shrink:0}
.progress-fill{height:100%;background:var(--accent);transition:width .4s ease}

/* ── RESULT SCREEN ── */
#screen-result{padding:0;overflow-y:auto}
.result-top{
  text-align:center;padding:28px 16px 20px;
  border-bottom:1px solid var(--border);
}
.result-score-big{font-size:clamp(48px,12vw,80px);font-weight:bold;color:var(--accent)}
.result-label{font-size:13px;color:var(--muted);font-family:var(--sans);margin-bottom:16px}
.result-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:360px;margin:0 auto 20px;
}
.result-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;
}
.rc-val{font-size:22px;font-weight:bold;margin-bottom:4px}
.rc-lbl{font-size:10px;color:var(--muted);font-family:var(--sans)}
.rc-correct{color:var(--correct)}.rc-wrong{color:var(--wrong)}.rc-timeout{color:var(--warn)}
.result-actions{display:flex;gap:10px;justify-content:center;margin-bottom:0;padding:0 16px 20px}
.btn-primary{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:12px 28px;font-size:15px;font-family:var(--sans);cursor:pointer;
}
.btn-primary:hover{opacity:.85}
.btn-outline{
  background:transparent;color:var(--muted2);border:1px solid var(--border2);
  border-radius:8px;padding:12px 20px;font-size:15px;font-family:var(--sans);cursor:pointer;
}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.review-section-title{
  font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;font-family:var(--sans);
  padding:12px 16px 8px;border-top:1px solid var(--border);
}
.review-list{
  padding:0 16px 80px;display:flex;flex-direction:column;gap:14px;
  max-width:680px;margin:0 auto;
}
.review-item{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;border-left:3px solid transparent;
}
.review-item.r-correct{border-left-color:var(--correct)}
.review-item.r-wrong{border-left-color:var(--wrong)}
.review-item.r-timeout{border-left-color:var(--warn)}
.ri-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ri-qnum{font-size:11px;color:var(--muted);font-family:var(--sans)}
.ri-status{
  font-size:10px;font-family:var(--sans);padding:3px 10px;border-radius:20px;font-weight:700;letter-spacing:.5px;
}
.ri-status.correct{background:rgba(61,186,126,.15);color:var(--correct)}
.ri-status.wrong{background:rgba(224,82,82,.12);color:var(--wrong)}
.ri-status.timeout{background:rgba(232,160,48,.12);color:var(--warn)}
.ri-sentence-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.ri-sentence{
  font-size:15px;line-height:1.7;flex:1;cursor:pointer;user-select:text;
}
.ri-translation{
  font-size:13px;color:var(--muted2);font-family:var(--sans);line-height:1.6;
  margin-bottom:10px;padding:8px 10px;background:var(--surface2);
  border-radius:6px;display:flex;align-items:flex-start;gap:8px;
}
.ri-translation-text{flex:1}
.speak-btn{
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:17px;padding:2px 4px;border-radius:4px;flex-shrink:0;
  transition:color .15s;line-height:1;
}
.speak-btn:hover{color:var(--accent)}
.speak-btn.speaking{color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ri-answer-row{
  display:flex;gap:12px;margin-bottom:8px;font-family:var(--sans);font-size:12px;flex-wrap:wrap;
}
.ri-answer-row span{display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-correct{background:var(--correct)}.dot-wrong{background:var(--wrong)}.dot-timeout{background:var(--warn)}
.ri-explanation{
  font-size:13px;color:var(--muted2);font-family:var(--sans);line-height:1.6;
  padding-top:8px;border-top:1px solid var(--border);
  display:flex;align-items:flex-start;gap:8px;
}
.ri-explanation-text{flex:1}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="hero-badge">TOEIC Part 5</div>
    <h1 class="hero-title">瞬間文法判断<br>トレーニング</h1>
    <p class="hero-sub">30問 · 20秒/問 · 時間切れ強制次問</p>
  </div>
  <div class="home-body">
    <div class="section-hdr">
      <span class="section-title">問題集ライブラリ</span>
      <button class="btn-add" onclick="document.getElementById('file-input').click()">
        ＋ 追加
      </button>
    </div>
    <input type="file" id="file-input" accept=".json" style="display:none" onchange="importJSON(event)">
    <div class="tile-grid" id="tile-grid"></div>
  </div>
</div>

<!-- Context Menu -->
<div class="ctx-overlay" id="ctx-overlay" onclick="closeCtx()">
  <div class="ctx-menu" onclick="event.stopPropagation()">
    <div class="ctx-header"><p id="ctx-title"></p></div>
    <button class="ctx-btn" onclick="ctxRename()">✏️ タイトル変更</button>
    <button class="ctx-btn" onclick="ctxChangeDate()">📅 日付変更</button>
    <button class="ctx-btn danger" onclick="ctxDelete()">🗑 削除</button>
    <button class="ctx-btn cancel" onclick="closeCtx()">キャンセル</button>
  </div>
</div>

<!-- Edit Overlay -->
<div class="edit-overlay" id="edit-overlay">
  <div class="edit-box">
    <h3 id="edit-title">タイトル変更</h3>
    <input type="text" class="edit-input" id="edit-input" placeholder="">
    <div class="edit-row">
      <button class="edit-cancel" onclick="closeEdit()">キャンセル</button>
      <button class="edit-ok" onclick="confirmEdit()">変更</button>
    </div>
  </div>
</div>

<!-- ═══ QUIZ ═══ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="q-counter">問題 <strong id="q-num">1</strong> / 30</div>
    <div class="timer-wrap">
      <div class="timer-num" id="timer-num">20</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
    </div>
    <div class="score-live">進捗 <strong id="q-done">0</strong>/30</div>
  </div>
  <div class="quiz-body">
    <p class="q-sentence" id="q-sentence"></p>
    <div class="choices" id="choices"></div>
  </div>
  <div class="progress-foot"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<!-- ═══ RESULT ═══ -->
<div id="screen-result" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goHome()">←</button>
    <span class="hdr-title" id="result-set-name"></span>
    <button class="hdr-action" onclick="restartCurrent()">再挑戦</button>
  </div>
  <div class="result-top">
    <div class="result-score-big" id="r-score"></div>
    <div class="result-label">/ 30問正解</div>
    <div class="result-cards">
      <div class="result-card"><div class="rc-val rc-correct" id="r-correct">0</div><div class="rc-lbl">正解</div></div>
      <div class="result-card"><div class="rc-val rc-wrong" id="r-wrong">0</div><div class="rc-lbl">不正解</div></div>
      <div class="result-card"><div class="rc-val rc-timeout" id="r-timeout">0</div><div class="rc-lbl">時間切れ</div></div>
    </div>
  </div>
  <div class="review-section-title">全問解説</div>
  <div class="review-list" id="review-list"></div>
</div>

<script>
// ═══ IndexedDB ═══
const DB_NAME = 'toeic_part5';
const DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('sets')) {
        d.createObjectStore('sets', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = e => rej(e);
  });
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction('sets', 'readonly');
    const req = tx.objectStore('sets').getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e);
  });
}
function dbPut(obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction('sets', 'readwrite');
    const req = tx.objectStore('sets').put(obj);
    req.onsuccess = () => res();
    req.onerror = e => rej(e);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction('sets', 'readwrite');
    const req = tx.objectStore('sets').delete(id);
    req.onsuccess = () => res();
    req.onerror = e => rej(e);
  });
}

// ═══ State ═══
const TOTAL = 30;
const TIME_LIMIT = 20;
let sets = [];
let currentSetId = null;
let questions = [];
let current = 0;
let answers = [];
let timer = null;
let timeLeft = TIME_LIMIT;
let locked = false;
let speaking = null;
let ctxTargetId = null;
let editMode = null;

// ═══ Init ═══
async function init() {
  await openDB();
  sets = await dbGetAll();
  renderTiles();
}

// ═══ TILES ═══
function renderTiles() {
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = '';
  const userSets = sets.filter(s => !s.isDemo);
  if (userSets.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">📂</div>
        <p>問題集がありません</p>
        <p style="margin-top:6px;font-size:12px">「＋ 追加」からJSONをインポートしてください</p>
      </div>`;
  }
  // Demo tile always at end
  userSets.forEach(s => grid.appendChild(makeTile(s)));
  grid.appendChild(makeDemoTile());
}

function makeTile(s) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.dataset.id = s.id;
  const dateStr = new Date(s.addedAt).toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
  tile.innerHTML = `
    <div class="tile-icon">📝</div>
    <div class="tile-name">${esc(s.name)}</div>
    <div class="tile-meta">
      <div class="tile-date">追加: ${dateStr}</div>
      <div class="tile-count">実施: <span>${s.playCount || 0}回</span></div>
    </div>`;
  tile.addEventListener('click', () => startSet(s.id));
  // Long press
  let pressTimer = null;
  tile.addEventListener('pointerdown', () => {
    pressTimer = setTimeout(() => openCtx(s.id), 600);
  });
  tile.addEventListener('pointerup', () => clearTimeout(pressTimer));
  tile.addEventListener('pointerleave', () => clearTimeout(pressTimer));
  return tile;
}

function makeDemoTile() {
  const tile = document.createElement('div');
  tile.className = 'tile tile-demo';
  tile.innerHTML = `
    <div class="tile-icon">🎯</div>
    <div class="tile-name">サンプル問題</div>
    <div class="tile-meta">
      <div class="tile-date">内蔵デモ</div>
      <div class="tile-count">30問</div>
    </div>`;
  tile.addEventListener('click', startDemo);
  return tile;
}

// ═══ IMPORT ═══
async function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    const qs = Array.isArray(data) ? data : data.questions;
    if (!qs || qs.length === 0) { alert('問題が見つかりませんでした'); return; }
    const id = 'set_' + Date.now();
    const name = file.name.replace(/\.json$/, '');
    const obj = { id, name, questions: qs, addedAt: Date.now(), playCount: 0 };
    await dbPut(obj);
    sets = await dbGetAll();
    renderTiles();
  } catch (e) {
    alert('JSONの読み込みに失敗しました: ' + e.message);
  }
  event.target.value = '';
}

// ═══ CONTEXT MENU ═══
function openCtx(id) {
  ctxTargetId = id;
  const s = sets.find(x => x.id === id);
  document.getElementById('ctx-title').textContent = s ? s.name : '';
  document.getElementById('ctx-overlay').classList.add('open');
}
function closeCtx() {
  document.getElementById('ctx-overlay').classList.remove('open');
  ctxTargetId = null;
}
function ctxRename() {
  closeCtx();
  const s = sets.find(x => x.id === ctxTargetId) || sets.find(x => x.id === ctxTargetId);
  const target = sets.find(x => x.id === ctxTargetId);
  document.getElementById('edit-title').textContent = 'タイトル変更';
  document.getElementById('edit-input').type = 'text';
  document.getElementById('edit-input').value = target ? target.name : '';
  editMode = 'rename';
  document.getElementById('edit-overlay').classList.add('open');
  setTimeout(() => document.getElementById('edit-input').focus(), 100);
}
function ctxChangeDate() {
  closeCtx();
  const target = sets.find(x => x.id === ctxTargetId);
  document.getElementById('edit-title').textContent = '日付変更';
  document.getElementById('edit-input').type = 'date';
  if (target) {
    const d = new Date(target.addedAt);
    document.getElementById('edit-input').value = d.toISOString().slice(0, 10);
  }
  editMode = 'date';
  document.getElementById('edit-overlay').classList.add('open');
}
async function ctxDelete() {
  closeCtx();
  const target = sets.find(x => x.id === ctxTargetId);
  if (!target) return;
  if (!confirm(`「${target.name}」を削除しますか？`)) return;
  await dbDelete(ctxTargetId);
  sets = await dbGetAll();
  renderTiles();
}
function closeEdit() {
  document.getElementById('edit-overlay').classList.remove('open');
  editMode = null;
}
async function confirmEdit() {
  const val = document.getElementById('edit-input').value.trim();
  if (!val) return;
  const target = sets.find(x => x.id === ctxTargetId);
  if (!target) { closeEdit(); return; }
  if (editMode === 'rename') {
    target.name = val;
  } else if (editMode === 'date') {
    target.addedAt = new Date(val).getTime();
  }
  await dbPut(target);
  sets = await dbGetAll();
  renderTiles();
  closeEdit();
}

// ═══ START QUIZ ═══
async function startSet(id) {
  const s = sets.find(x => x.id === id);
  if (!s) return;
  currentSetId = id;
  questions = s.questions.slice(0, TOTAL);
  while (questions.length < TOTAL && s.questions.length > 0) {
    questions = questions.concat(s.questions).slice(0, TOTAL);
  }
  document.getElementById('result-set-name').textContent = s.name;
  startQuiz();
}

function startDemo() {
  currentSetId = null;
  questions = DEMO_QUESTIONS.slice(0, TOTAL);
  document.getElementById('result-set-name').textContent = 'サンプル問題';
  startQuiz();
}

function startQuiz() {
  current = 0; answers = []; locked = false;
  showScreen('screen-quiz');
  showQuestion();
}

function showQuestion() {
  if (current >= TOTAL) { showResult(); return; }
  const q = questions[current];
  locked = false;
  document.getElementById('q-num').textContent = current + 1;
  document.getElementById('q-done').textContent = current;
  document.getElementById('progress-fill').style.width = (current / TOTAL * 100) + '%';

  const parts = q.sentence.split('-------');
  document.getElementById('q-sentence').innerHTML =
    parts[0] + '<span class="blank">_______</span>' + (parts[1] || '');

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span>${esc(c)}`;
    btn.onclick = () => select(i);
    choicesEl.appendChild(btn);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = TIME_LIMIT;
  updateTimerUI();
  timer = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timer); handleTimeout(); }
  }, 1000);
}

function updateTimerUI() {
  const el = document.getElementById('timer-num');
  const bar = document.getElementById('timer-bar');
  el.textContent = timeLeft;
  bar.style.width = (timeLeft / TIME_LIMIT * 100) + '%';
  const cls = timeLeft <= 5 ? ' danger' : timeLeft <= 8 ? ' warn' : '';
  el.className = 'timer-num' + cls;
  bar.className = 'timer-bar' + cls;
}

function handleTimeout() {
  if (locked) return;
  locked = true;
  answers.push({ status: 'timeout', chosen: -1, correct: questions[current].answer });
  setTimeout(nextQuestion, 400);
}

function select(i) {
  if (locked) return;
  locked = true;
  clearInterval(timer);
  const q = questions[current];
  const isCorrect = i === q.answer;
  const btns = document.querySelectorAll('.choice-btn');
  btns[i].classList.add('selected');
  answers.push({ status: isCorrect ? 'correct' : 'wrong', chosen: i, correct: q.answer });
  setTimeout(nextQuestion, 400);
}

function nextQuestion() { current++; showQuestion(); }

// ═══ RESULT ═══
async function showResult() {
  clearInterval(timer);
  // Update play count
  if (currentSetId) {
    const s = sets.find(x => x.id === currentSetId);
    if (s) { s.playCount = (s.playCount || 0) + 1; await dbPut(s); sets = await dbGetAll(); }
  }
  showScreen('screen-result');
  const correct = answers.filter(a => a.status === 'correct').length;
  const wrong   = answers.filter(a => a.status === 'wrong').length;
  const timeout = answers.filter(a => a.status === 'timeout').length;
  document.getElementById('r-score').textContent   = correct;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent   = wrong;
  document.getElementById('r-timeout').textContent = timeout;

  const labels = ['A', 'B', 'C', 'D'];
  const list = document.getElementById('review-list');
  list.innerHTML = '';

  questions.forEach((q, i) => {
    const ans = answers[i];
    const cls = ans.status;
    const statusText = cls === 'correct' ? '正解' : cls === 'wrong' ? '不正解' : '時間切れ';
    const filledSentence = q.sentence.replace('-------', `<strong style="color:var(--correct)">${esc(q.choices[q.answer])}</strong>`);

    const item = document.createElement('div');
    item.className = `review-item r-${cls}`;

    const translationHTML = q.translation
      ? `<div class="ri-translation">
           <span class="ri-translation-text">${esc(q.translation)}</span>
           <button class="speak-btn" onclick="speakText('ja','${escAttr(q.translation)}','spk-t-${i}')" id="spk-t-${i}">🔊</button>
         </div>` : '';

    item.innerHTML = `
      <div class="ri-meta">
        <span class="ri-qnum">Q${i+1}${q.category ? ' · '+q.category : ''}</span>
        <span class="ri-status ${cls}">${statusText}</span>
      </div>
      <div class="ri-sentence-row">
        <div class="ri-sentence" id="sent-${i}" onclick="selectAll('sent-${i}')">${filledSentence}</div>
        <button class="speak-btn" onclick="speakText('en','${escAttr(q.sentence.replace('-------',q.choices[q.answer]))}','spk-s-${i}')" id="spk-s-${i}">🔊</button>
      </div>
      ${translationHTML}
      <div class="ri-answer-row">
        <span><span class="dot dot-correct"></span>正解: ${labels[q.answer]}. ${esc(q.choices[q.answer])}</span>
        ${ans.status !== 'correct' && ans.chosen >= 0
          ? `<span><span class="dot dot-wrong"></span>選択: ${labels[ans.chosen]}. ${esc(q.choices[ans.chosen])}</span>` : ''}
        ${ans.status === 'timeout' ? `<span><span class="dot dot-timeout"></span>時間切れ</span>` : ''}
      </div>
      <div class="ri-explanation">
        <span class="ri-explanation-text">${esc(q.explanation)}</span>
        <button class="speak-btn" onclick="speakText('ja','${escAttr(q.explanation)}','spk-e-${i}')" id="spk-e-${i}">🔊</button>
      </div>`;
    list.appendChild(item);
  });
}

function selectAll(id) {
  const el = document.getElementById(id);
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function speakText(lang, text, btnId) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const btn = document.getElementById(btnId);
  if (speaking === btnId) {
    speaking = null;
    if (btn) btn.className = 'speak-btn';
    return;
  }
  document.querySelectorAll('.speak-btn').forEach(b => b.className = 'speak-btn');
  speaking = btnId;
  if (btn) btn.className = 'speak-btn speaking';
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang === 'ja' ? 'ja-JP' : 'en-US';
  utter.rate = lang === 'ja' ? 1.0 : 0.9;
  utter.onend = () => { speaking = null; if (btn) btn.className = 'speak-btn'; };
  window.speechSynthesis.speak(utter);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { showScreen('screen-home'); renderTiles(); }
function restartCurrent() {
  if (currentSetId) startSet(currentSetId); else startDemo();
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str||'').replace(/'/g,'&apos;').replace(/"/g,'&quot;');
}
